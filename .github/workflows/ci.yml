name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  generated-sdk:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache-dependency-path: sdk/go/go.sum
      - name: Verify generated SDKs
        run: scripts/gen-sdk.sh --check

  lint:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Lint workflows
        run: |
          brew install actionlint
          actionlint .github/workflows/*.yml
      - name: Release publication policy tests
        run: node --test scripts/release_publication.test.mjs
      - name: Qualify shell syntax gate
        run: node --test scripts/check_shell_syntax.test.mjs
      - name: Lint shell scripts
        run: bash scripts/check_shell_syntax.sh
      - name: Lint protos
        run: |
          brew install buf
          buf lint
      - name: Swift format check
        run: swift format lint --strict --recursive Sources Tests Package.swift
      - uses: actions/setup-go@v6
        with:
          go-version-file: guest/go.mod
      # The sandbox guest helper is linux-only: vet and cross-build it here
      # (its tests need a Linux kernel — they run in a sandbox locally).
      - name: Guest helper (linux/arm64)
        run: |
          test -z "$(gofmt -l guest)" || { gofmt -l guest; exit 1; }
          cd guest && GOOS=linux GOARCH=arm64 go vet ./... && GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -o /dev/null .

  build-test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Select native coverage
        id: coverage
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          scope=full
          if [[ "$EVENT_NAME" == pull_request ]] && git diff --quiet HEAD^1 HEAD -- . \
            ':(exclude)Sources/MicropodSharedFS/**' ':(exclude)Tests/MicropodSharedFSTests/**' ':(exclude)Sources/MicropodDockerShim/Handlers.swift' \
            ':(exclude)scripts/qualification/**' ':(exclude)scripts/bench_runtimes.py' \
            ':(exclude)scripts/bench_sharedfs_view.swift' ':(exclude)docs/benchmarks/**' \
            ':(exclude)README.md' ':(exclude).github/workflows/qualification.yml' ':(exclude).github/workflows/ci.yml'; then
            scope=storage-shim
          fi
          echo "scope=$scope" >> "$GITHUB_OUTPUT"
          echo "Native coverage: $scope"
      - name: Toolchain fingerprint
        run: echo "SWIFT_FINGERPRINT=$(swift --version 2>&1 | shasum | cut -c1-12)" >> "$GITHUB_ENV"
      - name: Restore Swift debug build
        uses: actions/cache@v4
        with:
          path: .build
          key: swiftpm-debug-${{ runner.os }}-${{ runner.arch }}-${{ env.SWIFT_FINGERPRINT }}-${{ hashFiles('Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            swiftpm-debug-${{ runner.os }}-${{ runner.arch }}-${{ env.SWIFT_FINGERPRINT }}-${{ hashFiles('Package.resolved') }}-
      - name: Build binaries and test bundle together
        run: swift build --build-tests
      - name: SharedFS CLI and daemon integration
        timeout-minutes: 2
        env:
          SCOPE: ${{ steps.coverage.outputs.scope }}
        run: |
          rounds=0
          if [[ "$SCOPE" == storage-shim ]]; then rounds=3; fi
          python3 scripts/qualification/daemon.py --scale-rounds "$rounds" --json "$RUNNER_TEMP/sharedfs.json"
      - name: Production Docker shim negotiation
        timeout-minutes: 2
        run: python3 scripts/qualification/shim.py --json "$RUNNER_TEMP/shim.json"
      - name: Publish integration receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-integration-receipts
          path: |
            ${{ runner.temp }}/sharedfs.json
            ${{ runner.temp }}/shim.json
          if-no-files-found: warn
      - name: Test
        env:
          SCOPE: ${{ steps.coverage.outputs.scope }}
        run: |
          if [[ "$SCOPE" == storage-shim ]]; then
            swift test --skip-build --filter 'MicropodSharedFSTests|MicropodDockerShimTests|MicropodIntegrationTests|CacheStoreTests|ForcedCacheRefreshTests|CICacheInventorySnapshotTests|MenuBarCacheTests|MenuBarPanelSnapshotTests|WorkspaceSnapshotTests'
          else
            swift test --skip-build
          fi

  # Keeps a warm release build for the Release workflow: a tag run can
  # only restore caches from its own tag or master, so master pushes save
  # the release .build (SwiftPM restores it; only changed modules compile).
  release-build-cache:
    if: github.event_name == 'push'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer || true
      - name: Toolchain fingerprint
        run: echo "SWIFT_FINGERPRINT=$(swift --version 2>&1 | shasum | cut -c1-12)" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: .build
          key: swiftpm-release-${{ env.SWIFT_FINGERPRINT }}-${{ hashFiles('Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            swiftpm-release-${{ env.SWIFT_FINGERPRINT }}-${{ hashFiles('Package.resolved') }}-
      - name: Release build
        run: swift build -c release
