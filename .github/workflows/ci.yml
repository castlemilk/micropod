name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Lint workflows
        run: |
          brew install actionlint
          actionlint .github/workflows/*.yml
      - name: Release publication policy tests
        run: node --test scripts/release_publication.test.mjs
      - name: Lint shell scripts
        run: |
          for f in scripts/*.sh scripts/install.sh scripts/make_dmg.sh ci/*.sh; do
            [ -f "$f" ] && bash -n "$f" || true
          done
      - name: Lint protos
        run: |
          brew install buf
          buf lint
      - name: Swift format check
        run: swift format lint --strict --recursive Sources Tests Package.swift
      - uses: actions/setup-go@v6
        with:
          go-version-file: guest/go.mod
      # The sandbox guest helper is linux-only: vet and cross-build it here
      # (its tests need a Linux kernel — they run in a sandbox locally).
      - name: Guest helper (linux/arm64)
        run: |
          test -z "$(gofmt -l guest)" || { gofmt -l guest; exit 1; }
          cd guest && GOOS=linux GOARCH=arm64 go vet ./... && GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -o /dev/null .

  build-test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: swift build
      - name: Test
        run: swift test

  # Keeps a warm release build for the Release workflow: a tag run can
  # only restore caches from its own tag or master, so master pushes save
  # the release .build (SwiftPM restores it; only changed modules compile).
  release-build-cache:
    if: github.event_name == 'push'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer || true
      - name: Toolchain fingerprint
        run: echo "SWIFT_FINGERPRINT=$(swift --version 2>&1 | shasum | cut -c1-12)" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: .build
          key: swiftpm-release-${{ env.SWIFT_FINGERPRINT }}-${{ hashFiles('Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            swiftpm-release-${{ env.SWIFT_FINGERPRINT }}-${{ hashFiles('Package.resolved') }}-
      - name: Release build
        run: swift build -c release
