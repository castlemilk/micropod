name: OrbStack live benchmark
on:
  push:
    branches: [benchmarks/orbstack-live-20261119]
    paths: [.github/workflows/orbstack-live.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  orbstack:
    runs-on: macos-15-intel
    timeout-minutes: 30
    env:
      ORB_APP: /Applications/OrbStack.app
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Record host and check virtualization
        run: |
          sw_vers
          uname -m
          sysctl machdep.cpu.brand_string machdep.cpu.family machdep.cpu.model machdep.cpu.stepping hw.ncpu hw.memsize kern.hv_support
          test "$(uname -m)" = x86_64
          test "$(sysctl -n kern.hv_support)" = 1
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.1'
          cache: false
      - name: Install OrbStack 1.5.1 for virtual Intel CPUs on this disposable runner
        run: |
          dmg="$RUNNER_TEMP/OrbStack.dmg"
          mount="$RUNNER_TEMP/orb-installer"
          mkdir "$mount"
          curl --fail --location --retry 2 --max-time 120 --output "$dmg" \
            https://cdn-updates.orbstack.dev/amd64/OrbStack_v1.5.1_16857_amd64.dmg
          echo "fb95108ded54a27603b68184a13f7e666e0e758167652c0b65cd4dc5eff94617  $dmg" | shasum -a 256 --check
          hdiutil attach -readonly -nobrowse -mountpoint "$mount" "$dmg"
          ditto "$mount/OrbStack.app" "$ORB_APP"
          hdiutil detach "$mount"
          codesign --verify --strict "$ORB_APP"
          /usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$ORB_APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print CFBundleVersion' "$ORB_APP/Contents/Info.plist"
          printf '%s\n' "$ORB_APP/Contents/MacOS/bin" "$ORB_APP/Contents/MacOS/xbin" "$HOME/.orbstack/bin" >> "$GITHUB_PATH"
      - name: Start OrbStack and verify its local Docker endpoint
        id: orbready
        run: |
          mkdir -p "$HOME/.docker/cli-plugins"
          python3 - <<'PY'
          import json, os, pathlib, subprocess, time
          path = pathlib.Path(os.environ["RUNNER_TEMP"]) / "orb-start.json"
          started = time.monotonic()
          subprocess.run(["orb", "config", "set", "setup.use_admin", "false"], check=True, timeout=120)
          subprocess.run(["orb", "start"], check=True, timeout=120)
          socket = pathlib.Path.home() / ".orbstack/run/docker.sock"
          last = ""
          while time.monotonic() - started < 200:
              health = subprocess.run(["curl", "--silent", "--show-error", "--fail", "--max-time", "4",
                                       "--unix-socket", str(socket), "http://localhost/info"],
                                      capture_output=True, text=True)
              if health.returncode == 0:
                  engine = json.loads(health.stdout)
                  break
              last = health.stderr.strip()
              if int(time.monotonic() - started) % 12 < 5:
                  print(f"Waiting for Docker API ({time.monotonic()-started:.0f}s): {last}", flush=True)
              time.sleep(1)
          else:
              raise SystemExit("OrbStack API readiness deadline: " + last)
          ready_ms = round((time.monotonic() - started) * 1000, 2)
          detail = {key: engine.get(key) for key in
                    ["OperatingSystem", "Name", "KernelVersion", "Architecture", "ServerVersion", "NCPU", "MemTotal"]}
          if "orbstack" not in str(detail).lower():
              raise SystemExit(f"Unverified OrbStack engine {detail}")
          record = {"first_cli_to_docker_info_ms": ready_ms, "identity": detail, "endpoint": "~/.orbstack/run/docker.sock"}
          path.write_text(json.dumps(record, indent=2) + "\n")
          print(json.dumps(record))
          PY
          if ! docker context inspect orbstack >/dev/null 2>&1; then
            docker context create orbstack --docker "host=unix://$HOME/.orbstack/run/docker.sock"
          fi
      - name: Build, run and scale validated containers
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          python3 scripts/qualification/engine.py --context orbstack --clients 1 4 8 16 --rounds 7 \
            --json "$RUNNER_TEMP/orb-engine.json"
      - name: Compare bind and volume reads of the same SharedFS view
        if: always() && steps.orbready.outcome == 'success'
        env:
          TMPDIR: ${{ runner.temp }}
        run: python3 scripts/qualification/orbstack_files.py --json "$RUNNER_TEMP/orb-files.json"
      - name: Publish sample timings and outcomes
        if: always()
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          for file in sorted(pathlib.Path(os.environ["RUNNER_TEMP"]).glob("orb-*.json")):
              result = json.loads(file.read_text())
              print("LANE", result.get("lane", file.name))
              for r in result.get("samples", []):
                  if r["case"] == "engine-identity":
                      print("SERVER", r.get("engine"), r.get("version", {}).get("Server", {}).get("Version"))
                  record = {k: r[k] for k in ["case", "solution", "shape", "clients", "warmup", "block", "outcome",
                                                "error", "validated_ms", "known_exits"] if k in r}
                  print("SAMPLE", json.dumps(record, separators=(",", ":")))
              print("FIXTURE", result.get("guest_sha256"), result.get("image_config_sha256"))
          PY
      - name: Capture startup diagnostics
        if: failure()
        run: |
          ls -ld "$HOME/.orbstack/run" "$HOME/.orbstack/run/docker.sock" || true
          ls "$HOME/.orbstack/log" || true
          for name in vmgr.log vm.log docker.log; do
            logfile="$HOME/.orbstack/log/$name"
            if [[ -f "$logfile" ]]; then
              tail -n 30 "$logfile"
            fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbstack-intel-receipts
          path: |
            ${{ runner.temp }}/orb-start.json
            ${{ runner.temp }}/orb-engine.json
            ${{ runner.temp }}/orb-files.json
          if-no-files-found: warn
