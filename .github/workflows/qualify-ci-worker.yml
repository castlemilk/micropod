name: Qualify the persistent CI worker
on:
  push:
    branches: [qualify/ci-kernel-gamma-20261120]
  pull_request:
    paths:
      - 'Sources/MicropodRuntime/CIWorker.swift'
      - 'Sources/MicropodRuntime/SandboxVM.swift'
      - 'Sources/MicropodCLI/CICommands.swift'
      - 'ci/worker-pipeline.sh'
      - 'scripts/qualify_ci_worker.py'
      - '.github/workflows/qualify-ci-worker.yml'
  workflow_dispatch:
    inputs:
      suite:
        description: Select the guest fixture or the physical Apple comparison
        type: choice
        options: [ubuntu-guest, apple-pair]
        default: ubuntu-guest
concurrency:
  group: micropod-worker-initial-qualification
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  guest:
    if: github.event_name == 'push' || inputs.suite == 'ubuntu-guest'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Exercise the pinned guest engine and retained storage
        shell: bash
        run: |
          args=(--pipelines --rounds 1 --clients 1 4)
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            args=(--packages --pipelines)
          fi
          python3 scripts/qualify_ci_worker.py linux-guest "${args[@]}" --json "$RUNNER_TEMP/guest.json"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: arm64-ci-guest
          path: ${{ runner.temp }}/guest.json

  apple:
    if: inputs.suite == 'apple-pair'
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check the physical Mac and peer engine
        shell: bash
        run: |
          test -S "$HOME/.orbstack/run/docker.sock"
          docker --host "unix://$HOME/.orbstack/run/docker.sock" info --format '{{.OperatingSystem}} {{.ID}}'
      - name: Build and sign Micropod
        run: |
          swift build -c release --product micropod
          codesign -f -s - --entitlements signing/micropod-cli.entitlements .build/release/micropod
      - name: Verify lifecycle and compare warm jobs on this Mac
        run: python3 scripts/qualify_ci_worker.py apple-worker --micropod "$PWD/.build/release/micropod" --orbstack-socket "$HOME/.orbstack/run/docker.sock" --json "$RUNNER_TEMP/apple.json"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: apple-worker-orbstack
          path: ${{ runner.temp }}/apple.json
