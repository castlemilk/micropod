name: Qualify the persistent CI worker
on:
  workflow_dispatch:
    inputs:
      suite:
        description: Select the guest fixture or the physical Apple comparison
        type: choice
        options: [ubuntu-guest, apple-pair]
        default: ubuntu-guest
      apple_runner:
        description: Label for the physical Apple Silicon benchmark rig
        type: string
        default: macOS
permissions:
  contents: read
jobs:
  guest:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Exercise the pinned guest engine and retained storage
        shell: bash
        run: |
          python3 scripts/qualify_ci_worker.py linux-guest --packages --pipelines \
            --ubuntu-bundle "$RUNNER_TEMP/ubuntu-bundle" --json "$RUNNER_TEMP/guest.json"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: arm64-ci-guest
          path: ${{ runner.temp }}/guest.json
      - uses: actions/upload-artifact@v7
        with:
          name: arm64-warm-ubuntu
          path: ${{ runner.temp }}/ubuntu-bundle/
          compression-level: 1
          retention-days: 3

  apple:
    needs: guest
    if: inputs.suite == 'apple-pair'
    runs-on: [self-hosted, ARM64, "${{ inputs.apple_runner || 'macOS' }}"]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check the physical Mac and peer engine
        shell: bash
        run: |
          test -S "$HOME/.orbstack/run/docker.sock"
          docker --host "unix://$HOME/.orbstack/run/docker.sock" info --format '{{.OperatingSystem}} {{.ID}}'
      - name: Build and sign Micropod
        run: |
          swift build -c release --product micropod
          codesign -f -s - --entitlements signing/micropod-cli.entitlements .build/release/micropod
      - uses: actions/download-artifact@v8
        with:
          name: arm64-warm-ubuntu
          path: ${{ runner.temp }}/ubuntu-bundle
      - name: Verify lifecycle and compare warm jobs on this Mac
        run: MICROPOD_BENCH_BIN="$PWD/.build/release/micropod" bash scripts/bench_ci_apple.sh "$RUNNER_TEMP/apple-bench" --ubuntu-bundle "$RUNNER_TEMP/ubuntu-bundle"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: apple-worker-orbstack
          path: ${{ runner.temp }}/apple-bench/*.json
