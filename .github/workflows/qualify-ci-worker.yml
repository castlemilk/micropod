name: Verify the persistent worker release candidate
on:
  push:
    branches: [qualify/ci-kernel-gamma-20261120]
concurrency:
  group: micropod-worker-rc-verification
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  guest:
    name: Paired Linux pipelines and raw process baseline
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Run all workloads on this runner
        run: python3 scripts/qualify_ci_worker.py linux-guest --packages --pipelines --json "$RUNNER_TEMP/guest.json"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: arm64-ci-guest
          path: ${{ runner.temp }}/guest.json
