name: Qualify development volume
on:
  workflow_dispatch:
  push:
    branches: [feat/dev-volume-and-live-kernel-bench]
permissions:
  contents: read
jobs:
  apfs:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Build the volume command for a disposable disk
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/Driver.swift" <<'SWIFT'
          import Foundation
          @main struct Driver {
              static func main() {
                  let args = Array(CommandLine.arguments.dropFirst())
                  guard args.starts(with: ["storage", "dev-volume"]) else { exit(2) }
                  do { try DevVolumeCommands.run(Array(args.dropFirst(2)).filter { $0 != "--json" }, json: args.contains("--json")) }
                  catch { FileHandle.standardError.write(Data((error.localizedDescription + "\n").utf8)); exit(1) }
              }
          }
          SWIFT
          swiftc -O -swift-version 6 -parse-as-library Sources/MicropodCLI/DevVolume*.swift "$RUNNER_TEMP/Driver.swift" -o "$RUNNER_TEMP/dev-volume"
      - name: Migrate and remount a disposable APFS volume
        run: python3 scripts/qualify_dev_volume.py --binary "$RUNNER_TEMP/dev-volume" --json "$RUNNER_TEMP/volume.json"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: development-volume
          path: ${{ runner.temp }}/volume.json

  warm-linux:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - name: Pull native Alpine
        run: docker pull alpine:3.20
      - name: Verify the running kernel and measure 1, 4, 8 and 16 clients
        run: python3 scripts/bench_live_kernel.py --engine linux-docker --socket /var/run/docker.sock --json "$RUNNER_TEMP/kernel.json"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: arm64-live-kernel
          path: ${{ runner.temp }}/kernel.json
