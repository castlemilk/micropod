name: Qualify development volume
on:
  workflow_dispatch:
  push:
    branches: [feat/dev-volume-and-live-kernel-bench]
permissions:
  contents: read
jobs:
  apfs:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Build Micropod CLI
        run: swift build --product micropod
      - name: Migrate and remount a disposable APFS volume
        run: python3 scripts/qualify_dev_volume.py --binary .build/debug/micropod --json "$RUNNER_TEMP/volume.json"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: development-volume
          path: ${{ runner.temp }}/volume.json

  warm-linux:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - name: Pull native Alpine
        run: docker pull alpine:3.20
      - name: Verify the running kernel and measure 1, 4, 8 and 16 clients
        run: python3 scripts/bench_live_kernel.py --engine linux-docker --socket /var/run/docker.sock --json "$RUNNER_TEMP/kernel.json"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: arm64-live-kernel
          path: ${{ runner.temp }}/kernel.json
