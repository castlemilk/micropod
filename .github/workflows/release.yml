name: Release

# Tag push (v*) builds the app, packages a DMG, and attaches it to the
# GitHub release. Signing + notarization run only when the Apple secrets
# are configured — otherwise an unsigned DMG is still published with a
# warning so the pipeline never hard-blocks a release.
#
# Required secrets for signed/notarized builds (see docs/releasing.md):
#   MACOS_CERTIFICATE            base64-encoded Developer ID .p12
#   MACOS_CERTIFICATE_PASSWORD   p12 export password
#   APPLE_SIGNING_IDENTITY       e.g. "Developer ID Application: X (TEAMID)"
#   NOTARY_API_KEY_BASE64        base64 AuthKey_*.p8 (App Store Connect API)
#   NOTARY_KEY_ID                the key's ID
#   NOTARY_ISSUER                issuer UUID
#   APPLE_TEAM_ID                for future verification
#
# Optional, as a secret of the protected release-publication environment:
#   RELEASE_WORKFLOWS_TOKEN      token with Workflows: write, used only from
#                                master for the Go module tag and release PATCH
#                                when a frozen source's workflows differ from
#                                master (docs/qualified-release-publication.md)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      qualification_version:
        description: "Draft-only signed qualification version (vX.Y.Z)"
        required: false
        type: string
      publication_version:
        description: "Publish frozen qualified assets using their reviewed channel policy (vX.Y.Z); no rebuild"
        required: false
        type: string
      qualification_security_floor:
        description: "Draft-only: signed runtime security floor (X.Y.Z) for the VM gate's floor test; tag releases ignore it"
        required: false
        type: string

permissions:
  contents: write
  actions: write # dispatch gh-pages deploy after the appcast push

# One release at a time: two tags pushed together raced on the appcast push
# to master (v0.10.2 lost to v0.11.1) and on GitHub's "Latest" flag.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # A version tag can name frozen qualified assets (qualification reserves
  # the tag before uploading them). A build for it would replace them, so a
  # tag push for one skips the build.
  frozen-qualification:
    runs-on: ubuntu-latest
    outputs:
      frozen: ${{ steps.check.outputs.frozen }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          frozen=false
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$RUNNER_TEMP/releases.json"
            # jq -e: 0 found, 1 not found; anything else is an unreadable
            # listing, which must not let a build replace frozen assets.
            found=0
            jq -es --arg tag "$TAG" 'add | any(.[]; .tag_name == $tag and any(.assets[]; .name | startswith("qualification-")))' \
              "$RUNNER_TEMP/releases.json" >/dev/null || found=$?
            case "$found" in
              0)
                frozen=true
                echo "::notice::$TAG names frozen qualified assets: publish them with publication_version; nothing is rebuilt."
                ;;
              1) ;;
              *) echo "::error::could not read the release listing (jq exit $found); refusing to build $TAG"; exit 1 ;;
            esac
          fi
          echo "frozen=$frozen" >> "$GITHUB_OUTPUT"

  release:
    needs: frozen-qualification
    if: needs.frozen-qualification.outputs.frozen != 'true' && (github.event_name != 'workflow_dispatch' || (inputs.qualification_version != '' && inputs.publication_version == ''))
    runs-on: macos-26
    env:
      VERSION: ${{ inputs.qualification_version || github.ref_name }}
    steps:
      - uses: actions/checkout@v7

      - name: Qualify source and signing requirements
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          SPARKLE_ED25519_KEY: ${{ secrets.SPARKLE_ED25519_KEY }}
        run: |
          set -euo pipefail
          [ "$(git rev-parse HEAD)" = "$GITHUB_SHA" ] || exit 1
          # Canonical vX.Y.Z only, as the policy parsers require (no leading zeros).
          [[ "$VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || exit 1
          [ "$GITHUB_REF" = "refs/heads/master" ] || exit 1
          [ -n "$APPLE_SIGNING_IDENTITY" ] && [ -n "$MACOS_CERTIFICATE" ] && [ -n "$SPARKLE_ED25519_KEY" ] || exit 1
          gh run list --workflow ci.yml --commit "$GITHUB_SHA" --event push \
            --json headSha,status,conclusion --limit 20 > "$RUNNER_TEMP/source-checks.json"
          jq -e --arg sha "$GITHUB_SHA" 'any(.[]; .headSha == $sha and .status == "completed" and .conclusion == "success")' \
            "$RUNNER_TEMP/source-checks.json" >/dev/null
          # Qualify once under a fresh version; never clobber an existing release.
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[].tag_name' > "$RUNNER_TEMP/release-tags.txt"
          if awk -v version="$VERSION" '$0 == version { found=1 } END { exit found ? 0 : 1 }' "$RUNNER_TEMP/release-tags.txt"; then exit 1; fi

      # Reserve the release tag now, while this commit is master's head.
      # GitHub refuses GITHUB_TOKEN a ref or release at a commit whose workflow
      # files no existing ref carries; master carries this one. A draft
      # published without a tag would create it at the frozen source, which
      # master has usually moved past. Tags made by GITHUB_TOKEN start no
      # tag-push build. This does not make publication free: updating a release
      # whose source changes workflows relative to master is refused as well
      # (see publish-qualified). The Go module tag waits for publication, so an
      # unpublished candidate never becomes a permanent module version.
      - name: Reserve the release tag
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          reserve() {
            local ref="$1" status=0 reserved_sha
            git ls-remote --exit-code origin "refs/tags/$ref" "refs/tags/$ref^{}" > "$RUNNER_TEMP/reserved-tag.txt" || status=$?
            if [ "$status" = 0 ]; then
              # Only a re-run after a failure before any release was created.
              reserved_sha=$(awk 'NR==1 { direct=$1 } /\^\{\}$/ { peeled=$1 } END { print peeled ? peeled : direct }' "$RUNNER_TEMP/reserved-tag.txt")
              [ "$reserved_sha" = "$GITHUB_SHA" ] || { echo "::error::$ref is already tagged at $reserved_sha"; exit 1; }
              return 0
            fi
            [ "$status" = 2 ] || exit "$status"
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$ref" -f sha="$GITHUB_SHA" > /dev/null ||
              { echo "::error::could not reserve $ref at $GITHUB_SHA; dispatch again on current master"; exit 1; }
          }
          reserve "$VERSION"

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer || true

      - name: Import signing certificate
        if: env.MACOS_CERTIFICATE != ''
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          echo "$MACOS_CERTIFICATE" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p ci "$RUNNER_TEMP/ci.keychain-db"
          # Keychains default to lock-after-300s — the package build now
          # outlasts that, so the first codesign in Build DMG would block on
          # an unlock prompt that can never render on a headless runner.
          security set-keychain-settings -lut 21600 "$RUNNER_TEMP/ci.keychain-db"
          security default-keychain -s "$RUNNER_TEMP/ci.keychain-db"
          security unlock-keychain -p ci "$RUNNER_TEMP/ci.keychain-db"
          security import "$RUNNER_TEMP/cert.p12" \
            -k "$RUNNER_TEMP/ci.keychain-db" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: \
            -k ci "$RUNNER_TEMP/ci.keychain-db"
          rm "$RUNNER_TEMP/cert.p12"

      - name: Store notary credentials
        if: env.MACOS_CERTIFICATE != ''
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          NOTARY_API_KEY_BASE64: ${{ secrets.NOTARY_API_KEY_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
        run: |
          mkdir -p "$RUNNER_TEMP/notary"
          echo "$NOTARY_API_KEY_BASE64" | base64 -d > "$RUNNER_TEMP/notary/AuthKey_$NOTARY_KEY_ID.p8"
          xcrun notarytool store-credentials "micropod-notary" \
            --key "$RUNNER_TEMP/notary/AuthKey_$NOTARY_KEY_ID.p8" \
            --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER" \
            --keychain "$RUNNER_TEMP/ci.keychain-db"

      # micropod-guest (the sandbox VMs' helper) is Go, cross-built for
      # linux/arm64 into the app's Resources by package_app.sh.
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.4'

      # The release build was 11 of this job's 13 minutes, mostly
      # dependencies (BoringSSL, NIO, gRPC, Containerization) that rarely
      # change. CI keeps a warm release build on master (a tag run can only
      # restore master's caches); restore it so only changed modules compile.
      - name: Toolchain fingerprint
        run: echo "SWIFT_FINGERPRINT=$(swift --version 2>&1 | shasum | cut -c1-12)" >> "$GITHUB_ENV"
      - uses: actions/cache/restore@v4
        with:
          path: .build
          key: swiftpm-release-${{ env.SWIFT_FINGERPRINT }}-${{ hashFiles('Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            swiftpm-release-${{ env.SWIFT_FINGERPRINT }}-${{ hashFiles('Package.resolved') }}-

      - name: Build + package app
        timeout-minutes: 25
        run: |
          bash scripts/package_app.sh "${VERSION#v}"
          # A release without the helper would silently fall back to the
          # images' shells, and one without the CLI couldn't update it: fail.
          test -s dist/Micropod.app/Contents/Resources/micropod-guest
          test -x dist/Micropod.app/Contents/MacOS/micropod-cli
          test -x dist/Micropod.app/Contents/MacOS/MicropodMCP

      # codesign --timestamp and notarytool submit --wait have no built-in
      # timeout — a stalled timestamp/notary connection would otherwise hang
      # the job until the global job limit. ~2min of work + notary wait.
      - name: Build DMG
        timeout-minutes: 20
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          SPARKLE_ED25519_KEY: ${{ secrets.SPARKLE_ED25519_KEY }}
          # Only a draft qualification build may carry a gate floor.
          MICROPOD_COMPONENTS_SECURITY_FLOOR: ${{ github.event_name == 'workflow_dispatch' && inputs.qualification_version != '' && inputs.qualification_security_floor || '' }}
        run: |
          if [ -n "$APPLE_SIGNING_IDENTITY" ] && [ -n "$MACOS_CERTIFICATE" ]; then
            # make_dmg.sh signs the runtime component manifest with the release
            # key (scripts/write_runtime_components.sh): rigs self-update only
            # from a manifest that key signed.
            sparkle=$(jq -er '.pins[] | select(.identity == "sparkle") | .state.version' Package.resolved)
            curl -fsSL -o /tmp/sparkle-components.tar.xz \
              "https://github.com/sparkle-project/Sparkle/releases/download/$sparkle/Sparkle-$sparkle.tar.xz"
            # sign_update is handed the release key: only pinned bytes run.
            bash scripts/verify_sparkle_tools.sh "$sparkle" /tmp/sparkle-components.tar.xz
            mkdir -p /tmp/sparkle-components && tar -xf /tmp/sparkle-components.tar.xz -C /tmp/sparkle-components
            echo "$SPARKLE_ED25519_KEY" | base64 -d > "$RUNNER_TEMP/components-ed.key"
            trap 'rm -f "$RUNNER_TEMP/components-ed.key"' EXIT
            SPARKLE_SIGN_UPDATE=/tmp/sparkle-components/bin/sign_update \
              SPARKLE_ED_KEY_FILE="$RUNNER_TEMP/components-ed.key" \
              bash scripts/make_dmg.sh --sign "$APPLE_SIGNING_IDENTITY" \
              --notarize --key-profile micropod-notary
            rm -f "$RUNNER_TEMP/components-ed.key"
            test -s dist/Micropod.app/Contents/Resources/runtime-components.json.sig
            echo "DMG_ASSET=Micropod.dmg" >> "$GITHUB_ENV"
          else
            # Name it differently so an unsigned CI build can never clobber a
            # signed Micropod.dmg uploaded by a local release run.
            echo "::warning::Apple signing secrets not configured — publishing unsigned DMG"
            bash scripts/make_dmg.sh
            mv dist/Micropod.dmg dist/Micropod-unsigned.dmg
            mv dist/Micropod.dmg.sha256 dist/Micropod-unsigned.dmg.sha256
            sed -i '' 's/Micropod\.dmg/Micropod-unsigned.dmg/' dist/Micropod-unsigned.dmg.sha256
            echo "DMG_ASSET=Micropod-unsigned.dmg" >> "$GITHUB_ENV"
          fi

      - name: Verify updater bundle contract
        if: env.DMG_ASSET == 'Micropod.dmg'
        run: bash scripts/verify_updater_bundle.sh dist/Micropod.app "${VERSION#v}" "$GITHUB_SHA"

      # The tarball was packed before signing: repack it from the signed,
      # notarized bundle, so its standalone CLI and MCP server are the same
      # Developer ID binaries `micropod update cli` installs.
      - name: Repack tarball with signed binaries
        if: env.DMG_ASSET == 'Micropod.dmg'
        run: |
          cp dist/Micropod.app/Contents/MacOS/micropod-cli dist/micropod
          cp dist/Micropod.app/Contents/MacOS/MicropodMCP dist/micropod-mcp-bin
          codesign --verify --strict dist/micropod dist/micropod-mcp-bin
          tar -czf "dist/Micropod.${VERSION#v}.tgz" -C dist Micropod.app micropod-mcp micropod-mcp-bin micropod

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GATE_SECURITY_FLOOR: ${{ github.event_name == 'workflow_dispatch' && inputs.qualification_version != '' && inputs.qualification_security_floor || '' }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            [ "$DMG_ASSET" = "Micropod.dmg" ] || exit 1
            printf '%s\n' "$GITHUB_SHA" > dist/qualification-source.txt
            # A VM-gate floor marks the draft: publication refuses it
            # (scripts/verify_qualified_release.mjs).
            if [ -n "$GATE_SECURITY_FLOOR" ]; then
              printf 'gate-security-floor=%s\n' "$GATE_SECURITY_FLOOR" >> dist/qualification-source.txt
            fi
            gh release create "$VERSION" \
              "dist/$DMG_ASSET" "dist/$DMG_ASSET.sha256" "dist/Micropod.${VERSION#v}.tgz" \
              dist/qualification-source.txt --target "$GITHUB_SHA" --draft --latest=false \
              --title "$VERSION — qualification only" --notes "Signed candidate; no appcast publication or installation."
            gh release view "$VERSION" --json isDraft,targetCommitish > "$RUNNER_TEMP/candidate.json"
            jq -e --arg sha "$GITHUB_SHA" '.isDraft == true and .targetCommitish == $sha' "$RUNNER_TEMP/candidate.json" >/dev/null
            # The tag reserved at qualification must still name this source.
            git ls-remote --exit-code origin "refs/tags/$VERSION" "refs/tags/$VERSION^{}" > "$RUNNER_TEMP/qualification-tag.txt"
            candidate_tag_sha=$(awk 'NR==1 { direct=$1 } /\^\{\}$/ { peeled=$1 } END { print peeled ? peeled : direct }' "$RUNNER_TEMP/qualification-tag.txt")
            [ "$candidate_tag_sha" = "$GITHUB_SHA" ] || exit 1
            exit 0
          fi
          # "Latest" (what the landing page downloads) only if no higher
          # version is already released.
          highest=$( (gh release list --limit 100 --json tagName --jq '.[].tagName'; echo "$VERSION") | sort -V | tail -1)
          latest=$([ "$highest" = "$VERSION" ] && echo true || echo false)
          gh release create "$VERSION" \
            "dist/$DMG_ASSET" "dist/$DMG_ASSET.sha256" "dist/Micropod.${VERSION#v}.tgz" \
            --title "$VERSION" --generate-notes --latest="$latest" || \
          gh release upload "$VERSION" \
            "dist/$DMG_ASSET" "dist/$DMG_ASSET.sha256" "dist/Micropod.${VERSION#v}.tgz" \
            --clobber

      # Sparkle feed: sign the DMG with the EdDSA key and push an updated
      # appcast.xml to master (gh-pages deploy publishes it). This must live
      # here, not in a `release: published` workflow — releases created by
      # GITHUB_TOKEN do not trigger further workflows.
      - name: Sign DMG for Sparkle feed
        if: env.DMG_ASSET == 'Micropod.dmg'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SPARKLE_ED25519_KEY: ${{ secrets.SPARKLE_ED25519_KEY }}
        run: |
          if [ -z "$SPARKLE_ED25519_KEY" ]; then
            echo "::warning::SPARKLE_ED25519_KEY not configured — appcast not updated"
            exit 0
          fi
          # Sign with the same Sparkle release the app links (Package.resolved).
          sparkle=$(jq -er '.pins[] | select(.identity == "sparkle") | .state.version' Package.resolved)
          curl -fsSL -o /tmp/sparkle.tar.xz \
            "https://github.com/sparkle-project/Sparkle/releases/download/$sparkle/Sparkle-$sparkle.tar.xz"
          bash scripts/verify_sparkle_tools.sh "$sparkle" /tmp/sparkle.tar.xz
          mkdir -p /tmp/sparkle && tar -xf /tmp/sparkle.tar.xz -C /tmp/sparkle
          echo "$SPARKLE_ED25519_KEY" | base64 -d > "$RUNNER_TEMP/ed.key"
          /tmp/sparkle/bin/sign_update --ed-key-file "$RUNNER_TEMP/ed.key" \
            dist/Micropod.dmg > "$RUNNER_TEMP/sig.txt"
          rm "$RUNNER_TEMP/ed.key"
          SIG=$(sed -n 's/.*sparkle:edSignature="\([^"]*\)".*/\1/p' "$RUNNER_TEMP/sig.txt")
          LEN=$(sed -n 's/.*length="\([^"]*\)".*/\1/p' "$RUNNER_TEMP/sig.txt")
          [ -n "$SIG" ] && [ -n "$LEN" ] || { echo "::error::failed to parse signature"; exit 1; }
          # Publish appcast re-applies the entry if master moved (public values).
          { echo "SPARKLE_SIG=$SIG"; echo "SPARKLE_LEN=$LEN"; } >> "$GITHUB_ENV"
          node scripts/update_appcast.mjs \
            --version "${VERSION#v}" \
            --url "https://github.com/castlemilk/micropod/releases/download/$VERSION/Micropod.dmg" \
            --signature "$SIG" --length "$LEN" --source "$GITHUB_SHA" \
            --minimum-update-version "$(jq -er .minimumUpdateVersion release/updater-policy.json)" \
            --workload-protocol "$(jq -er .workloadProtocol release/updater-policy.json)"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            gh release view "$VERSION" --json isDraft,targetCommitish > "$RUNNER_TEMP/candidate.json"
            jq -e --arg sha "$GITHUB_SHA" '.isDraft == true and .targetCommitish == $sha' "$RUNNER_TEMP/candidate.json" >/dev/null
            cp landing/appcast.xml "$RUNNER_TEMP/qualification-appcast.xml"
            gh release upload "$VERSION" "$RUNNER_TEMP/qualification-appcast.xml"
            gh release view "$VERSION" --json isDraft,targetCommitish > "$RUNNER_TEMP/candidate.json"
            jq -e --arg sha "$GITHUB_SHA" '.isDraft == true and .targetCommitish == $sha' "$RUNNER_TEMP/candidate.json" >/dev/null
          fi

      # A failed qualification that created no release returns its reserved
      # tag, so the version can be qualified again from current master. This
      # also clears a reservation an earlier, interrupted run left behind: vX
      # at this source with no release for it. A draft keeps its tag; deleting
      # the draft with --cleanup-tag removes it.
      - name: Release an unused qualification tag
        if: (failure() || cancelled()) && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[].tag_name' > "$RUNNER_TEMP/release-tags-after.txt"
          if awk -v version="$VERSION" '$0 == version { found=1 } END { exit found ? 0 : 1 }' "$RUNNER_TEMP/release-tags-after.txt"; then exit 0; fi
          status=0
          git ls-remote --exit-code origin "refs/tags/$VERSION" "refs/tags/$VERSION^{}" > "$RUNNER_TEMP/unused-tag.txt" || status=$?
          [ "$status" = 2 ] && exit 0
          [ "$status" = 0 ] || exit "$status"
          reserved_sha=$(awk 'NR==1 { direct=$1 } /\^\{\}$/ { peeled=$1 } END { print peeled ? peeled : direct }' "$RUNNER_TEMP/unused-tag.txt")
          [ "$reserved_sha" = "$GITHUB_SHA" ] || exit 0
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$VERSION"

      # Stable and qualification feeds are published only from a frozen,
      # reviewed manifest by publish-qualified. Tag builds never enable installs.

  sdk:
    needs: frozen-qualification
    if: needs.frozen-qualification.outputs.frozen != 'true' && (github.event_name != 'workflow_dispatch' || (inputs.qualification_version != '' && inputs.publication_version == ''))
    runs-on: macos-26
    env:
      VERSION: ${{ inputs.qualification_version || github.ref_name }}
    steps:
      - uses: actions/checkout@v7

      # Authenticated: the action resolves buf's download via the GitHub API,
      # and anonymous calls from shared runner IPs hit the 60/h limit (the
      # v0.10.1 sdk job failed here before doing anything).
      - uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.4'
          cache-dependency-path: sdk/go/go.sum

      - name: Verify generated code is in sync
        run: scripts/gen-sdk.sh --check

      - name: Build + test Go SDK
        run: cd sdk/go && go build ./... && go test ./...

      - name: Build + pack TypeScript SDK
        run: |
          mkdir -p dist
          cd sdk/ts
          npm ci
          npm run build
          # The tarball carries package.json's version: stamp the tag's so it
          # can never lag the release (v0.9.1 shipped a 0.9.0 package).
          npm version "${VERSION#v}" --no-git-tag-version --allow-same-version
          npm pack --pack-destination ../../dist
          mv "../../dist/micropod-sdk-"*.tgz "../../dist/micropod-sdk-${VERSION#v}.tgz"

      - name: Build Swift SDK
        run: cd sdk/swift && swift build

      - uses: actions/upload-artifact@v4
        if: github.event_name != 'workflow_dispatch'
        with:
          name: typescript-sdk
          path: dist/micropod-sdk-*.tgz
          retention-days: 7

  sdk-publish:
    if: github.event_name != 'workflow_dispatch'
    needs: [release, sdk]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.qualification_version || github.ref_name }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v4
        with:
          name: typescript-sdk
          path: dist

      - name: Upload TypeScript SDK asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$VERSION" "dist/micropod-sdk-${VERSION#v}.tgz" --clobber

      # Go modules resolve by path-versioned tag: sdk/go/v0.7.0 makes
      # `go get github.com/castlemilk/micropod/sdk/go@sdk/go/v0.7.0` work.
      - name: Tag Go module version
        if: github.event_name != 'workflow_dispatch'
        # Idempotent: a re-run, or a tag pushed by hand alongside vX.Y.Z, is
        # fine as long as it names this commit; one elsewhere fails loudly.
        run: |
          remote=$(git ls-remote origin "refs/tags/sdk/go/$VERSION^{}" | cut -f1)
          [ -n "$remote" ] || remote=$(git ls-remote origin "refs/tags/sdk/go/$VERSION" | cut -f1)
          if [ -n "$remote" ]; then
            [ "$remote" = "$(git rev-parse HEAD)" ] && { echo "sdk/go/$VERSION already at HEAD"; exit 0; }
            echo "::error::sdk/go/$VERSION exists at $remote, not $(git rev-parse HEAD)"; exit 1
          fi
          git tag "sdk/go/$VERSION"
          git push origin "refs/tags/sdk/go/$VERSION"

  publication-inputs:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      # This job has no environment. If it can see RELEASE_WORKFLOWS_TOKEN, the
      # token is a repository or organization secret, available to every job,
      # rather than an environment secret of release-publication.
      - name: Prove the workflows token exists only in its environment
        env:
          VISIBLE_OUTSIDE_ENVIRONMENT: ${{ secrets.RELEASE_WORKFLOWS_TOKEN != '' }}
        run: |
          if [ "$VISIBLE_OUTSIDE_ENVIRONMENT" != false ]; then
            echo "::error::RELEASE_WORKFLOWS_TOKEN is visible outside the release-publication environment; delete the repository or organization secret and store it only as an environment secret (docs/qualified-release-publication.md)"
            exit 1
          fi
      - name: Require exactly one release mode
        env:
          QUALIFICATION: ${{ inputs.qualification_version }}
          PUBLICATION: ${{ inputs.publication_version }}
        run: |
          set -euo pipefail
          if [ -n "$QUALIFICATION" ] && [ -z "$PUBLICATION" ]; then version="$QUALIFICATION"
          elif [ -n "$PUBLICATION" ] && [ -z "$QUALIFICATION" ]; then version="$PUBLICATION"
          else echo "::error::choose exactly one qualification or publication version"; exit 1
          fi
          [[ "$version" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || { echo "::error::$version is not a canonical vX.Y.Z (no leading zeros)"; exit 1; }

  publish-qualified:
    if: github.event_name == 'workflow_dispatch' && inputs.publication_version != '' && inputs.qualification_version == ''
    needs: publication-inputs
    runs-on: ubuntu-latest
    # The optional RELEASE_WORKFLOWS_TOKEN is an environment secret here, used
    # only from master for the Go module tag and the release PATCH
    # (docs/qualified-release-publication.md).
    environment: release-publication
    env:
      VERSION: ${{ inputs.publication_version }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Verify publication source and frozen qualification
        env:
          # Presence only: the token itself never enters this step.
          WORKFLOWS_TOKEN_PRESENT: ${{ secrets.RELEASE_WORKFLOWS_TOKEN != '' }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "$GITHUB_REF" = refs/heads/* ]]
          [ "$(git rev-parse HEAD)" = "$GITHUB_SHA" ]
          manifest="docs/qualified-releases/$VERSION.json"
          [ -f "$manifest" ]
          policy=$(jq -r .policy "$manifest")
          case "$policy" in informational|workload-preserving-candidate|workload-preserving-v1) ;; *) exit 1 ;; esac
          cp "$manifest" "$RUNNER_TEMP/publication-manifest.json"
          [ "$(jq -r .tag "$manifest")" = "$VERSION" ]
          release_id=$(jq -r .releaseID "$manifest")
          source=$(jq -r .source "$manifest")
          qualification_run=$(jq -r .qualificationRun "$manifest")
          if [ "$GITHUB_REF" = refs/heads/master ]; then event=push; else event=pull_request; fi
          gh run list --workflow ci.yml --commit "$GITHUB_SHA" --event "$event" --json headSha,status,conclusion --limit 20 > "$RUNNER_TEMP/checks.json"
          jq -e --arg sha "$GITHUB_SHA" 'any(.[]; .headSha == $sha and .status == "completed" and .conclusion == "success")' "$RUNNER_TEMP/checks.json" >/dev/null
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$qualification_run" > "$RUNNER_TEMP/qualification.json"
          jq -e --arg source "$source" '.head_sha == $source and .event == "workflow_dispatch" and .path == ".github/workflows/release.yml" and .status == "completed" and .conclusion == "success"' "$RUNNER_TEMP/qualification.json" >/dev/null
          git merge-base --is-ancestor "$source" HEAD
          gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" > "$RUNNER_TEMP/release-before.json"
          mkdir -p "$RUNNER_TEMP/qualified-assets"
          while IFS=$'\t' read -r name asset_id; do
            gh api -H "Accept: application/octet-stream" "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" > "$RUNNER_TEMP/qualified-assets/$name"
          done < <(jq -r '.assets | to_entries[] | [.key, .value.id] | @tsv' "$manifest")
          node scripts/verify_qualified_release.mjs --verify "$RUNNER_TEMP/release-before.json" "$manifest" "$RUNNER_TEMP/qualified-assets"
          git ls-remote origin "refs/tags/$VERSION" "refs/tags/$VERSION^{}" > "$RUNNER_TEMP/tag-before.txt"
          node scripts/verify_qualified_release.mjs --tag "$RUNNER_TEMP/tag-before.txt" "$manifest"
          # The Go module tag is created at the frozen source just before the
          # release becomes public (promote step); one elsewhere is refused.
          git ls-remote origin "refs/tags/sdk/go/$VERSION" "refs/tags/sdk/go/$VERSION^{}" > "$RUNNER_TEMP/sdk-tag.txt"
          sdk_sha=$(awk 'NR==1 { direct=$1 } /\^\{\}$/ { peeled=$1 } END { print peeled ? peeled : direct }' "$RUNNER_TEMP/sdk-tag.txt")
          if [ -n "$sdk_sha" ] && [ "$sdk_sha" != "$source" ]; then
            echo "::error::sdk/go/$VERSION names $sdk_sha, not the qualified source $source"; exit 1
          fi
          # GitHub refuses to create or update a release whose source adds or
          # modifies .github/workflows relative to master unless the token may
          # modify workflows, and GITHUB_TOKEN never can: the PATCH answers an
          # opaque 404. Decide before any mutation, for every draft and for a
          # stable release that still needs Latest.
          draft=$(jq -r .draft "$RUNNER_TEMP/release-before.json")
          needs_update=$draft
          if [ "$policy" = workload-preserving-v1 ] && [ "$draft" = false ]; then
            latest_id=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .id 2>/dev/null || echo unknown)
            [ "$latest_id" = "$release_id" ] || needs_update=true
          fi
          if [ -z "$sdk_sha" ] && [ "$needs_update" != true ]; then
            echo "::warning::sdk/go/$VERSION does not exist; it is created only when this workflow publishes the release"
          fi
          use_workflows_token=false
          if [ "$needs_update" = true ]; then
            parity=0
            bash scripts/release_workflow_parity.sh "$source" > "$RUNNER_TEMP/workflow-parity.txt" || parity=$?
            if [ "$parity" != 0 ]; then
              [ "$parity" = 1 ] || { echo "::error::could not compare $source's workflows with master"; exit 1; }
              if [ ! -s "$RUNNER_TEMP/tag-before.txt" ]; then
                # Publishing a tagless draft creates its tag. With a workflows
                # token that tag push would start the release workflow as it was
                # at the frozen source, which rebuilds and replaces the assets.
                echo "::error::$VERSION has no tag and its workflows differ from master ($(paste -sd, "$RUNNER_TEMP/workflow-parity.txt")). It cannot be published by this workflow; qualify a fresh version from master (docs/qualified-release-publication.md)."
                exit 1
              fi
              if [ "$WORKFLOWS_TOKEN_PRESENT" != true ]; then
                echo "::error::$VERSION's source changes workflows relative to master ($(paste -sd, "$RUNNER_TEMP/workflow-parity.txt")). GitHub refuses GITHUB_TOKEN this release update. Add RELEASE_WORKFLOWS_TOKEN to the protected release-publication environment, or qualify a fresh version from master (docs/qualified-release-publication.md)."
                exit 1
              fi
              # The token is trusted only on master, behind required reviewers
              # that admins cannot bypass, in an environment that deploys from
              # master alone. publication-inputs already proved it is not a
              # repository or organization secret.
              [ "$GITHUB_REF" = refs/heads/master ] ||
                { echo "::error::RELEASE_WORKFLOWS_TOKEN is used only for publication from master"; exit 1; }
              gh api "repos/$GITHUB_REPOSITORY/environments/release-publication" > "$RUNNER_TEMP/publication-environment.json" ||
                { echo "::error::could not read the release-publication environment"; exit 1; }
              gh api "repos/$GITHUB_REPOSITORY/environments/release-publication/deployment-branch-policies" \
                > "$RUNNER_TEMP/publication-branch-policies.json" ||
                { echo "::error::could not read the release-publication deployment branch policies"; exit 1; }
              if ! jq -e '((.protection_rules // []) | any(.type == "required_reviewers"))
                  and .can_admins_bypass == false
                  and .deployment_branch_policy.custom_branch_policies == true
                  and .deployment_branch_policy.protected_branches == false' \
                "$RUNNER_TEMP/publication-environment.json" >/dev/null ||
                ! jq -e '(.branch_policies | length) == 1 and .branch_policies[0].name == "master"
                  and ((.branch_policies[0].type // "branch") == "branch")' \
                "$RUNNER_TEMP/publication-branch-policies.json" >/dev/null; then
                echo "::error::release-publication must require reviewers, disallow admin bypass and deploy only from master (one branch policy, master) before RELEASE_WORKFLOWS_TOKEN is used"
                exit 1
              fi
              use_workflows_token=true
              echo "::notice::$VERSION's workflows differ from master; the release update uses RELEASE_WORKFLOWS_TOKEN"
            fi
          fi
          echo "$needs_update" > "$RUNNER_TEMP/needs-release-update"
          echo "$use_workflows_token" > "$RUNNER_TEMP/use-workflows-token"
          if [ "$policy" = workload-preserving-candidate ]; then channel=qualification; else channel=stable; fi
          feed=landing/appcast.xml
          if [ "$channel" = qualification ]; then feed=landing/qualification-appcast.xml; fi
          node scripts/verify_qualified_release.mjs --appcast "$RUNNER_TEMP/publication-manifest.json" "$feed" "$channel"
          git checkout -- "$feed"

      - name: Promote the exact existing assets without a tag build
        env:
          RELEASE_WORKFLOWS_TOKEN: ${{ secrets.RELEASE_WORKFLOWS_TOKEN }}
        run: |
          wt="${RELEASE_WORKFLOWS_TOKEN:-}"; unset RELEASE_WORKFLOWS_TOKEN
          set -euo pipefail
          manifest="docs/qualified-releases/$VERSION.json"
          release_id=$(jq -r .releaseID "$manifest")
          source=$(jq -r .source "$manifest")
          gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" > "$RUNNER_TEMP/release-before.json"
          node scripts/verify_qualified_release.mjs --verify "$RUNNER_TEMP/release-before.json" "$manifest" "$RUNNER_TEMP/qualified-assets"
          git ls-remote origin "refs/tags/$VERSION" "refs/tags/$VERSION^{}" > "$RUNNER_TEMP/tag-before.txt"
          node scripts/verify_qualified_release.mjs --tag "$RUNNER_TEMP/tag-before.txt" "$manifest"
          # Only the Go module tag and the release PATCH may use the workflows
          # token, and only when the verification step chose it for a tagged
          # release. Repository scripts never see it (unset above).
          patch_token="$GH_TOKEN"
          if [ "$(cat "$RUNNER_TEMP/use-workflows-token")" = true ]; then
            [ -s "$RUNNER_TEMP/tag-before.txt" ] && [ -n "$wt" ] && [ "$GITHUB_REF" = refs/heads/master ] || exit 1
            patch_token="$wt"
          elif [ "$(cat "$RUNNER_TEMP/needs-release-update")" = true ]; then
            # Master may have moved since verification: GITHUB_TOKEN still needs parity.
            bash scripts/release_workflow_parity.sh "$source" > "$RUNNER_TEMP/workflow-parity.txt" || {
              echo "::error::master's workflows changed after verification; dispatch publication again"; exit 1; }
          fi
          wt=""
          if [ "$(cat "$RUNNER_TEMP/needs-release-update")" = true ]; then
            # Go modules resolve by path-versioned tag. Created only now, at the
            # frozen source, so an unpublished candidate never becomes a
            # permanent module version. sdk/go/* is not a v* tag: no build runs.
            git ls-remote origin "refs/tags/sdk/go/$VERSION" "refs/tags/sdk/go/$VERSION^{}" > "$RUNNER_TEMP/sdk-tag.txt"
            sdk_sha=$(awk 'NR==1 { direct=$1 } /\^\{\}$/ { peeled=$1 } END { print peeled ? peeled : direct }' "$RUNNER_TEMP/sdk-tag.txt")
            if [ -z "$sdk_sha" ]; then
              GH_TOKEN="$patch_token" gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
                -f ref="refs/tags/sdk/go/$VERSION" -f sha="$source" > "$RUNNER_TEMP/sdk-tag.json" ||
                { echo "::error::could not create sdk/go/$VERSION at $source; the release was not changed"; exit 1; }
            elif [ "$sdk_sha" != "$source" ]; then
              echo "::error::sdk/go/$VERSION names $sdk_sha, not the qualified source $source"; exit 1
            fi
          fi
          release_patch() {
            GH_TOKEN="$patch_token" gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$release_id" "$@" || {
              echo "::error::GitHub refused the release update. A 404 means the token may not modify workflows; see docs/qualified-release-publication.md"
              return 1
            }
          }
          # Promotion never creates a v* tag or calls the artifact build/upload
          # path. GITHUB_TOKEN promotion triggers no workflow; a workflows
          # token's triggers only the read-only Update Feed Policy report.
          if jq -e '.draft == true' "$RUNNER_TEMP/release-before.json" >/dev/null; then
            policy=$(jq -r .policy "$manifest")
            if [ "$policy" = informational ]; then
              title="$VERSION — qualified release"
              body="These frozen signed and notarized assets are announced with a web link only. Automatic installation remains unavailable for this release. Source $(jq -r .source "$manifest")."
            else
              title="$VERSION — workload-preserving updater"
              body="Frozen signed and notarized desktop assets; workload protocol $(jq -r .workloadProtocol "$manifest"). Runtime services and engines retain their existing ownership. Publication policy: $policy. Source $(jq -r .source "$manifest")."
            fi
            release_patch --field draft=false --raw-field make_latest=false \
              --raw-field name="$title" --raw-field body="$body" > "$RUNNER_TEMP/promotion-response.json"
          else
            echo "Exact qualified assets already public; do not repeat release mutation."
          fi
          gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" > "$RUNNER_TEMP/release-after.json"
          jq -e '.draft == false' "$RUNNER_TEMP/release-after.json" >/dev/null
          node scripts/verify_qualified_release.mjs --verify "$RUNNER_TEMP/release-after.json" "$manifest" "$RUNNER_TEMP/qualified-assets"
          git ls-remote origin "refs/tags/$VERSION" "refs/tags/$VERSION^{}" > "$RUNNER_TEMP/tag-after.txt"
          node scripts/verify_qualified_release.mjs --published-tag "$RUNNER_TEMP/tag-after.txt" "$manifest"
          if [ "$(jq -r .policy "$manifest")" = workload-preserving-v1 ]; then
            latest_id=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .id)
            if [ "$latest_id" != "$release_id" ]; then
              release_patch --raw-field make_latest=true > "$RUNNER_TEMP/stable-promotion-response.json"
            fi
            gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" > "$RUNNER_TEMP/release-after.json"
            node scripts/verify_qualified_release.mjs --verify "$RUNNER_TEMP/release-after.json" "$manifest" "$RUNNER_TEMP/qualified-assets"
          fi

      - name: Publish the reviewed channel policy
        if: github.ref == 'refs/heads/master'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          pushed=false
          policy=$(jq -r .policy "$RUNNER_TEMP/publication-manifest.json")
          channel=stable
          feed=landing/appcast.xml
          if [ "$policy" = workload-preserving-candidate ]; then channel=qualification; feed=landing/qualification-appcast.xml; fi
          for attempt in 1 2 3; do
            echo "Publishing $channel feed, attempt $attempt"
            # Retry only against fresh master; never overwrite concurrent commits.
            git fetch origin master
            git reset --hard origin/master
            node scripts/verify_qualified_release.mjs --appcast "$RUNNER_TEMP/publication-manifest.json" "$feed" "$channel"
            git add "$feed"
            if git diff --cached --quiet; then pushed=true; break; fi
            git commit -m "appcast: $VERSION $channel policy"
            if git push origin HEAD:master; then pushed=true; break; fi
          done
          [ "$pushed" = true ]
          # Bot pushes suppress downstream push workflows: dispatch existing Pages.
          gh workflow run gh-pages.yml --ref master

      - name: Retain publication metadata receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qualified-publication-metadata
          path: |
            ${{ runner.temp }}/release-before.json
            ${{ runner.temp }}/release-after.json
            ${{ runner.temp }}/qualification.json
            ${{ runner.temp }}/tag-before.txt
            ${{ runner.temp }}/tag-after.txt
            ${{ runner.temp }}/publication-manifest.json
            ${{ runner.temp }}/stable-promotion-response.json
            ${{ runner.temp }}/sdk-tag.txt
            ${{ runner.temp }}/sdk-tag.json
            ${{ runner.temp }}/workflow-parity.txt
            ${{ runner.temp }}/publication-environment.json
            ${{ runner.temp }}/publication-branch-policies.json
          retention-days: 14
