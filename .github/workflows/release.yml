name: Release

# Tag push (v*) builds the app, packages a DMG, and attaches it to the
# GitHub release. Signing + notarization run only when the Apple secrets
# are configured — otherwise an unsigned DMG is still published with a
# warning so the pipeline never hard-blocks a release.
#
# Required secrets for signed/notarized builds (see docs/releasing.md):
#   MACOS_CERTIFICATE            base64-encoded Developer ID .p12
#   MACOS_CERTIFICATE_PASSWORD   p12 export password
#   APPLE_SIGNING_IDENTITY       e.g. "Developer ID Application: X (TEAMID)"
#   NOTARY_API_KEY_BASE64        base64 AuthKey_*.p8 (App Store Connect API)
#   NOTARY_KEY_ID                the key's ID
#   NOTARY_ISSUER                issuer UUID
#   APPLE_TEAM_ID                for future verification

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      qualification_version:
        description: "Draft-only signed qualification version (vX.Y.Z)"
        required: false
        type: string
      publication_version:
        description: "Publish an existing qualified draft as an informational announcement (vX.Y.Z); no build or installation"
        required: false
        type: string

permissions:
  contents: write
  actions: write # dispatch gh-pages deploy after the appcast push

# One release at a time: two tags pushed together raced on the appcast push
# to master (v0.10.2 lost to v0.11.1) and on GitHub's "Latest" flag.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name != 'workflow_dispatch' || (inputs.qualification_version != '' && inputs.publication_version == '')
    runs-on: macos-26
    env:
      VERSION: ${{ inputs.qualification_version || github.ref_name }}
    steps:
      - uses: actions/checkout@v7

      - name: Qualify source and signing requirements
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          SPARKLE_ED25519_KEY: ${{ secrets.SPARKLE_ED25519_KEY }}
        run: |
          set -euo pipefail
          [ "$(git rev-parse HEAD)" = "$GITHUB_SHA" ] || exit 1
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          [ "$GITHUB_REF" = "refs/heads/master" ] || exit 1
          [ -n "$APPLE_SIGNING_IDENTITY" ] && [ -n "$MACOS_CERTIFICATE" ] && [ -n "$SPARKLE_ED25519_KEY" ] || exit 1
          gh run list --workflow ci.yml --commit "$GITHUB_SHA" --event push \
            --json headSha,status,conclusion --limit 20 > "$RUNNER_TEMP/source-checks.json"
          jq -e --arg sha "$GITHUB_SHA" 'any(.[]; .headSha == $sha and .status == "completed" and .conclusion == "success")' \
            "$RUNNER_TEMP/source-checks.json" >/dev/null
          # Qualify once under a fresh version; never clobber an existing release.
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[].tag_name' > "$RUNNER_TEMP/release-tags.txt"
          if awk -v version="$VERSION" '$0 == version { found=1 } END { exit found ? 0 : 1 }' "$RUNNER_TEMP/release-tags.txt"; then exit 1; fi
          if git ls-remote --exit-code origin "refs/tags/$VERSION" > "$RUNNER_TEMP/qualification-tag.txt"; then
            exit 1
          else
            lookup_status=$?
            [ "$lookup_status" = 2 ] || exit "$lookup_status"
          fi

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer || true

      - name: Import signing certificate
        if: env.MACOS_CERTIFICATE != ''
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          echo "$MACOS_CERTIFICATE" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p ci "$RUNNER_TEMP/ci.keychain-db"
          # Keychains default to lock-after-300s — the package build now
          # outlasts that, so the first codesign in Build DMG would block on
          # an unlock prompt that can never render on a headless runner.
          security set-keychain-settings -lut 21600 "$RUNNER_TEMP/ci.keychain-db"
          security default-keychain -s "$RUNNER_TEMP/ci.keychain-db"
          security unlock-keychain -p ci "$RUNNER_TEMP/ci.keychain-db"
          security import "$RUNNER_TEMP/cert.p12" \
            -k "$RUNNER_TEMP/ci.keychain-db" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: \
            -k ci "$RUNNER_TEMP/ci.keychain-db"
          rm "$RUNNER_TEMP/cert.p12"

      - name: Store notary credentials
        if: env.MACOS_CERTIFICATE != ''
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          NOTARY_API_KEY_BASE64: ${{ secrets.NOTARY_API_KEY_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
        run: |
          mkdir -p "$RUNNER_TEMP/notary"
          echo "$NOTARY_API_KEY_BASE64" | base64 -d > "$RUNNER_TEMP/notary/AuthKey_$NOTARY_KEY_ID.p8"
          xcrun notarytool store-credentials "micropod-notary" \
            --key "$RUNNER_TEMP/notary/AuthKey_$NOTARY_KEY_ID.p8" \
            --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER" \
            --keychain "$RUNNER_TEMP/ci.keychain-db"

      # micropod-guest (the sandbox VMs' helper) is Go, cross-built for
      # linux/arm64 into the app's Resources by package_app.sh.
      - uses: actions/setup-go@v6
        with:
          go-version-file: guest/go.mod

      # The release build was 11 of this job's 13 minutes, mostly
      # dependencies (BoringSSL, NIO, gRPC, Containerization) that rarely
      # change. CI keeps a warm release build on master (a tag run can only
      # restore master's caches); restore it so only changed modules compile.
      - name: Toolchain fingerprint
        run: echo "SWIFT_FINGERPRINT=$(swift --version 2>&1 | shasum | cut -c1-12)" >> "$GITHUB_ENV"
      - uses: actions/cache/restore@v4
        with:
          path: .build
          key: swiftpm-release-${{ env.SWIFT_FINGERPRINT }}-${{ hashFiles('Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            swiftpm-release-${{ env.SWIFT_FINGERPRINT }}-${{ hashFiles('Package.resolved') }}-

      - name: Build + package app
        timeout-minutes: 25
        run: |
          bash scripts/package_app.sh "${VERSION#v}"
          # A release without the helper would silently fall back to the
          # images' shells, and one without the CLI couldn't update it: fail.
          test -s dist/Micropod.app/Contents/Resources/micropod-guest
          test -x dist/Micropod.app/Contents/MacOS/micropod-cli
          test -x dist/Micropod.app/Contents/MacOS/MicropodMCP

      # codesign --timestamp and notarytool submit --wait have no built-in
      # timeout — a stalled timestamp/notary connection would otherwise hang
      # the job until the global job limit. ~2min of work + notary wait.
      - name: Build DMG
        timeout-minutes: 20
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
        run: |
          if [ -n "$APPLE_SIGNING_IDENTITY" ] && [ -n "$MACOS_CERTIFICATE" ]; then
            bash scripts/make_dmg.sh --sign "$APPLE_SIGNING_IDENTITY" \
              --notarize --key-profile micropod-notary
            echo "DMG_ASSET=Micropod.dmg" >> "$GITHUB_ENV"
          else
            # Name it differently so an unsigned CI build can never clobber a
            # signed Micropod.dmg uploaded by a local release run.
            echo "::warning::Apple signing secrets not configured — publishing unsigned DMG"
            bash scripts/make_dmg.sh
            mv dist/Micropod.dmg dist/Micropod-unsigned.dmg
            mv dist/Micropod.dmg.sha256 dist/Micropod-unsigned.dmg.sha256
            sed -i '' 's/Micropod\.dmg/Micropod-unsigned.dmg/' dist/Micropod-unsigned.dmg.sha256
            echo "DMG_ASSET=Micropod-unsigned.dmg" >> "$GITHUB_ENV"
          fi

      # The tarball was packed before signing: repack it from the signed,
      # notarized bundle, so its standalone CLI and MCP server are the same
      # Developer ID binaries `micropod update cli` installs.
      - name: Repack tarball with signed binaries
        if: env.DMG_ASSET == 'Micropod.dmg'
        run: |
          cp dist/Micropod.app/Contents/MacOS/micropod-cli dist/micropod
          cp dist/Micropod.app/Contents/MacOS/MicropodMCP dist/micropod-mcp-bin
          codesign --verify --strict dist/micropod dist/micropod-mcp-bin
          tar -czf "dist/Micropod.${VERSION#v}.tgz" -C dist Micropod.app micropod-mcp micropod-mcp-bin micropod

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            [ "$DMG_ASSET" = "Micropod.dmg" ] || exit 1
            printf '%s\n' "$GITHUB_SHA" > dist/qualification-source.txt
            gh release create "$VERSION" \
              "dist/$DMG_ASSET" "dist/$DMG_ASSET.sha256" "dist/Micropod.${VERSION#v}.tgz" \
              dist/qualification-source.txt --target "$GITHUB_SHA" --draft --latest=false \
              --title "$VERSION — qualification only" --notes "Signed candidate; no appcast publication or installation."
            gh release view "$VERSION" --json isDraft,targetCommitish > "$RUNNER_TEMP/candidate.json"
            jq -e --arg sha "$GITHUB_SHA" '.isDraft == true and .targetCommitish == $sha' "$RUNNER_TEMP/candidate.json" >/dev/null
            if git ls-remote --exit-code origin "refs/tags/$VERSION" "refs/tags/$VERSION^{}" > "$RUNNER_TEMP/qualification-tag.txt"; then
              candidate_tag_sha=$(awk 'NR==1 { direct=$1 } /\^\{\}$/ { peeled=$1 } END { print peeled ? peeled : direct }' "$RUNNER_TEMP/qualification-tag.txt")
              [ "$candidate_tag_sha" = "$GITHUB_SHA" ] || exit 1
            else
              lookup_status=$?
              [ "$lookup_status" = 2 ] || exit "$lookup_status"
            fi
            exit 0
          fi
          # "Latest" (what the landing page downloads) only if no higher
          # version is already released.
          highest=$( (gh release list --limit 100 --json tagName --jq '.[].tagName'; echo "$VERSION") | sort -V | tail -1)
          latest=$([ "$highest" = "$VERSION" ] && echo true || echo false)
          gh release create "$VERSION" \
            "dist/$DMG_ASSET" "dist/$DMG_ASSET.sha256" "dist/Micropod.${VERSION#v}.tgz" \
            --title "$VERSION" --generate-notes --latest="$latest" || \
          gh release upload "$VERSION" \
            "dist/$DMG_ASSET" "dist/$DMG_ASSET.sha256" "dist/Micropod.${VERSION#v}.tgz" \
            --clobber

      # Sparkle feed: sign the DMG with the EdDSA key and push an updated
      # appcast.xml to master (gh-pages deploy publishes it). This must live
      # here, not in a `release: published` workflow — releases created by
      # GITHUB_TOKEN do not trigger further workflows.
      - name: Sign DMG for Sparkle feed
        if: env.DMG_ASSET == 'Micropod.dmg'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SPARKLE_ED25519_KEY: ${{ secrets.SPARKLE_ED25519_KEY }}
        run: |
          if [ -z "$SPARKLE_ED25519_KEY" ]; then
            echo "::warning::SPARKLE_ED25519_KEY not configured — appcast not updated"
            exit 0
          fi
          curl -sL -o /tmp/sparkle.tar.xz \
            https://github.com/sparkle-project/Sparkle/releases/download/2.10.0/Sparkle-2.10.0.tar.xz
          mkdir -p /tmp/sparkle && tar -xf /tmp/sparkle.tar.xz -C /tmp/sparkle
          echo "$SPARKLE_ED25519_KEY" | base64 -d > "$RUNNER_TEMP/ed.key"
          /tmp/sparkle/bin/sign_update --ed-key-file "$RUNNER_TEMP/ed.key" \
            dist/Micropod.dmg > "$RUNNER_TEMP/sig.txt"
          rm "$RUNNER_TEMP/ed.key"
          SIG=$(sed -n 's/.*sparkle:edSignature="\([^"]*\)".*/\1/p' "$RUNNER_TEMP/sig.txt")
          LEN=$(sed -n 's/.*length="\([^"]*\)".*/\1/p' "$RUNNER_TEMP/sig.txt")
          [ -n "$SIG" ] && [ -n "$LEN" ] || { echo "::error::failed to parse signature"; exit 1; }
          # Publish appcast re-applies the entry if master moved (public values).
          { echo "SPARKLE_SIG=$SIG"; echo "SPARKLE_LEN=$LEN"; } >> "$GITHUB_ENV"
          node scripts/update_appcast.mjs \
            --version "${VERSION#v}" \
            --url "https://github.com/castlemilk/micropod/releases/download/$VERSION/Micropod.dmg" \
            --signature "$SIG" --length "$LEN"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            gh release view "$VERSION" --json isDraft,targetCommitish > "$RUNNER_TEMP/candidate.json"
            jq -e --arg sha "$GITHUB_SHA" '.isDraft == true and .targetCommitish == $sha' "$RUNNER_TEMP/candidate.json" >/dev/null
            cp landing/appcast.xml "$RUNNER_TEMP/qualification-appcast.xml"
            gh release upload "$VERSION" "$RUNNER_TEMP/qualification-appcast.xml"
            gh release view "$VERSION" --json isDraft,targetCommitish > "$RUNNER_TEMP/candidate.json"
            jq -e --arg sha "$GITHUB_SHA" '.isDraft == true and .targetCommitish == $sha' "$RUNNER_TEMP/candidate.json" >/dev/null
          fi

      - name: Publish appcast
        if: env.DMG_ASSET == 'Micropod.dmg' && github.event_name != 'workflow_dispatch'
        env:
          SPARKLE_ED25519_KEY: ${{ secrets.SPARKLE_ED25519_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [ -n "$SPARKLE_ED25519_KEY" ] || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Master can move while the release builds: re-apply this version's
          # entry on its tip and retry, instead of failing the release.
          for attempt in 1 2 3 4 5; do
            git fetch -q origin master
            git checkout -q --detach origin/master
            node scripts/update_appcast.mjs \
              --version "${VERSION#v}" \
              --url "https://github.com/castlemilk/micropod/releases/download/$VERSION/Micropod.dmg" \
              --signature "$SPARKLE_SIG" --length "$SPARKLE_LEN"
            git add landing/appcast.xml
            git diff --cached --quiet && { echo "no change"; exit 0; }
            git commit -q -m "appcast: $VERSION"
            git push origin HEAD:master && break
            [ "$attempt" = 5 ] && { echo "::error::appcast push kept losing races"; exit 1; }
            sleep $((attempt * 5))
          done
          # GITHUB_TOKEN pushes don't trigger workflows — dispatch the Pages
          # deploy explicitly so the appcast actually reaches the live feed.
          gh workflow run gh-pages.yml --ref master

  # Publishable client SDKs (proto-generated, sdk/): verified and packed in
  # parallel with the app build; sdk-publish attaches them once the release
  # exists, so they never land on a release that failed.
  sdk:
    if: github.event_name != 'workflow_dispatch' || (inputs.qualification_version != '' && inputs.publication_version == '')
    runs-on: macos-26
    env:
      VERSION: ${{ inputs.qualification_version || github.ref_name }}
    steps:
      - uses: actions/checkout@v7

      # Authenticated: the action resolves buf's download via the GitHub API,
      # and anonymous calls from shared runner IPs hit the 60/h limit (the
      # v0.10.1 sdk job failed here before doing anything).
      - uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: actions/setup-go@v6
        with:
          go-version: stable

      # buf.gen.yaml uses local plugins for the Go surface; pin to the
      # versions that generated the checked-in code so the drift check is
      # deterministic.
      - name: Install protoc plugins
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          go install connectrpc.com/connect/cmd/protoc-gen-connect-go@v1.20.0
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2

      - name: Verify generated code is in sync
        run: scripts/gen-sdk.sh --check

      - name: Build + test Go SDK
        run: cd sdk/go && go build ./... && go test ./...

      - name: Build + pack TypeScript SDK
        run: |
          mkdir -p dist
          cd sdk/ts
          npm ci
          npm run build
          # The tarball carries package.json's version: stamp the tag's so it
          # can never lag the release (v0.9.1 shipped a 0.9.0 package).
          npm version "${VERSION#v}" --no-git-tag-version --allow-same-version
          npm pack --pack-destination ../../dist
          mv "../../dist/micropod-sdk-"*.tgz "../../dist/micropod-sdk-${VERSION#v}.tgz"

      - name: Build Swift SDK
        run: cd sdk/swift && swift build

      - uses: actions/upload-artifact@v4
        if: github.event_name != 'workflow_dispatch'
        with:
          name: typescript-sdk
          path: dist/micropod-sdk-*.tgz
          retention-days: 7

  sdk-publish:
    if: github.event_name != 'workflow_dispatch'
    needs: [release, sdk]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.qualification_version || github.ref_name }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v4
        with:
          name: typescript-sdk
          path: dist

      - name: Upload TypeScript SDK asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$VERSION" "dist/micropod-sdk-${VERSION#v}.tgz" --clobber

      # Go modules resolve by path-versioned tag: sdk/go/v0.7.0 makes
      # `go get github.com/castlemilk/micropod/sdk/go@sdk/go/v0.7.0` work.
      - name: Tag Go module version
        if: github.event_name != 'workflow_dispatch'
        # Idempotent: a re-run, or a tag pushed by hand alongside vX.Y.Z, is
        # fine as long as it names this commit; one elsewhere fails loudly.
        run: |
          remote=$(git ls-remote origin "refs/tags/sdk/go/$VERSION^{}" | cut -f1)
          [ -n "$remote" ] || remote=$(git ls-remote origin "refs/tags/sdk/go/$VERSION" | cut -f1)
          if [ -n "$remote" ]; then
            [ "$remote" = "$(git rev-parse HEAD)" ] && { echo "sdk/go/$VERSION already at HEAD"; exit 0; }
            echo "::error::sdk/go/$VERSION exists at $remote, not $(git rev-parse HEAD)"; exit 1
          fi
          git tag "sdk/go/$VERSION"
          git push origin "refs/tags/sdk/go/$VERSION"

  publication-inputs:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Require exactly one release mode
        env:
          QUALIFICATION: ${{ inputs.qualification_version }}
          PUBLICATION: ${{ inputs.publication_version }}
        run: |
          set -euo pipefail
          if [ -n "$QUALIFICATION" ] && [ -z "$PUBLICATION" ]; then version="$QUALIFICATION"
          elif [ -n "$PUBLICATION" ] && [ -z "$QUALIFICATION" ]; then version="$PUBLICATION"
          else echo "::error::choose exactly one qualification or publication version"; exit 1
          fi
          [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]

  publish-qualified:
    if: github.event_name == 'workflow_dispatch' && inputs.publication_version != '' && inputs.qualification_version == ''
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.publication_version }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Verify publication source and frozen qualification
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$GITHUB_REF" = refs/heads/* ]]
          [ "$(git rev-parse HEAD)" = "$GITHUB_SHA" ]
          manifest="docs/qualified-releases/$VERSION.json"
          [ -f "$manifest" ]
          [ "$(jq -r .policy "$manifest")" = informational ]
          [ "$(jq -r .tag "$manifest")" = "$VERSION" ]
          release_id=$(jq -r .releaseID "$manifest")
          source=$(jq -r .source "$manifest")
          qualification_run=$(jq -r .qualificationRun "$manifest")
          if [ "$GITHUB_REF" = refs/heads/master ]; then event=push; else event=pull_request; fi
          gh run list --workflow ci.yml --commit "$GITHUB_SHA" --event "$event" --json headSha,status,conclusion --limit 20 > "$RUNNER_TEMP/checks.json"
          jq -e --arg sha "$GITHUB_SHA" 'any(.[]; .headSha == $sha and .status == "completed" and .conclusion == "success")' "$RUNNER_TEMP/checks.json" >/dev/null
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$qualification_run" > "$RUNNER_TEMP/qualification.json"
          jq -e --arg source "$source" '.head_sha == $source and .event == "workflow_dispatch" and .path == ".github/workflows/release.yml" and .status == "completed" and .conclusion == "success"' "$RUNNER_TEMP/qualification.json" >/dev/null
          git merge-base --is-ancestor "$source" HEAD
          gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" > "$RUNNER_TEMP/release-before.json"
          mkdir -p "$RUNNER_TEMP/qualified-assets"
          while IFS=$'\t' read -r name asset_id; do
            gh api -H "Accept: application/octet-stream" "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" > "$RUNNER_TEMP/qualified-assets/$name"
          done < <(jq -r '.assets | to_entries[] | [.key, .value.id] | @tsv' "$manifest")
          node scripts/verify_qualified_release.mjs --verify "$RUNNER_TEMP/release-before.json" "$manifest" "$RUNNER_TEMP/qualified-assets"
          git ls-remote origin "refs/tags/$VERSION" "refs/tags/$VERSION^{}" > "$RUNNER_TEMP/tag-before.txt"
          node scripts/verify_qualified_release.mjs --tag "$RUNNER_TEMP/tag-before.txt" "$manifest"
          if jq -e '.draft == true' "$RUNNER_TEMP/release-before.json" >/dev/null; then
            # GitHub cannot authorize GITHUB_TOKEN to modify workflows. Promote
            # from a reviewed branch before master diverges from frozen source.
            git fetch origin master
            git diff --quiet "$source" origin/master -- .github/workflows
          fi
          node scripts/update_appcast.mjs --informational --version "$VERSION" --url "https://github.com/castlemilk/micropod/releases/tag/$VERSION" --appcast landing/appcast.xml
          git checkout -- landing/appcast.xml

      - name: Promote the exact existing assets without a tag build
        run: |
          set -euo pipefail
          manifest="docs/qualified-releases/$VERSION.json"
          release_id=$(jq -r .releaseID "$manifest")
          gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" > "$RUNNER_TEMP/release-before.json"
          node scripts/verify_qualified_release.mjs --verify "$RUNNER_TEMP/release-before.json" "$manifest" "$RUNNER_TEMP/qualified-assets"
          git ls-remote origin "refs/tags/$VERSION" "refs/tags/$VERSION^{}" > "$RUNNER_TEMP/tag-before.txt"
          node scripts/verify_qualified_release.mjs --tag "$RUNNER_TEMP/tag-before.txt" "$manifest"
          # GITHUB_TOKEN promotion does not trigger release:published or tag-push
          # workflows. Never push a tag or call the artifact build/upload path.
          if jq -e '.draft == true' "$RUNNER_TEMP/release-before.json" >/dev/null; then
            git fetch origin master
            git diff --quiet "$(jq -r .source "$manifest")" origin/master -- .github/workflows
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$release_id" \
              --field draft=false --raw-field make_latest=false \
              --raw-field name="$VERSION — cache visibility" \
              --raw-field body="Cache visibility fixes in the app and tray. These are the already qualified signed and notarized assets; source $(jq -r .source "$manifest"). The update feed announces this release with a web link only: it cannot download or install it. The guarded automatic installer remains unavailable until host admission and recovery are qualified. Close Micropod and stop its workloads before any separately approved manual installation." > "$RUNNER_TEMP/promotion-response.json"
          else
            echo "Exact qualified assets already public; do not repeat release mutation."
          fi
          gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" > "$RUNNER_TEMP/release-after.json"
          jq -e '.draft == false' "$RUNNER_TEMP/release-after.json" >/dev/null
          node scripts/verify_qualified_release.mjs --verify "$RUNNER_TEMP/release-after.json" "$manifest" "$RUNNER_TEMP/qualified-assets"
          git ls-remote origin "refs/tags/$VERSION" "refs/tags/$VERSION^{}" > "$RUNNER_TEMP/tag-after.txt"
          node scripts/verify_qualified_release.mjs --published-tag "$RUNNER_TEMP/tag-after.txt" "$manifest"

      - name: Publish only an informational appcast item
        if: github.ref == 'refs/heads/master'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          pushed=false
          for attempt in 1 2 3; do
            echo "Publishing informational feed, attempt $attempt"
            # Retry only against fresh master; never overwrite concurrent commits.
            git fetch origin master
            git reset --hard origin/master
            node scripts/update_appcast.mjs --informational --version "$VERSION" --url "https://github.com/castlemilk/micropod/releases/tag/$VERSION"
            git add landing/appcast.xml
            if git diff --cached --quiet; then pushed=true; break; fi
            git commit -m "appcast: $VERSION information only"
            if git push origin HEAD:master; then pushed=true; break; fi
          done
          [ "$pushed" = true ]
          # Bot pushes suppress downstream push workflows: dispatch existing Pages.
          gh workflow run gh-pages.yml --ref master

      - name: Retain publication metadata receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qualified-publication-metadata
          path: |
            ${{ runner.temp }}/release-before.json
            ${{ runner.temp }}/release-after.json
            ${{ runner.temp }}/qualification.json
            ${{ runner.temp }}/tag-before.txt
            ${{ runner.temp }}/tag-after.txt
          retention-days: 14
