name: Update Feed Policy

# Human publication does not grant desktop installation permission. The
# manifest-verified Release publisher owns both stable and qualification feeds.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master
      - name: Report the required publication path
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ github.event.release.id }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" > "$RUNNER_TEMP/release.json"
          kind=$(node scripts/verify_qualified_release.mjs --policy "$RUNNER_TEMP/release.json")
          echo "Release classification: $kind. No feed was changed."
          echo "Qualify the signed assets, review their manifest, then dispatch Release with publication_version."
