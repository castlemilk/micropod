version: "3"

vars:
  BIN: .build/debug
  RELEASE_BIN: .build/release

tasks:
  default:
    desc: Build everything (debug)
    cmds:
      - task: proto
      - swift build

  proto:
    desc: Regenerate Swift protobuf models
    cmds:
      - buf lint
      - buf generate

  build:
    desc: Release build
    cmds:
      - task: proto
      - swift build -c release

  run:
    desc: Run the desktop app (debug)
    cmds:
      - swift run MicropodApp

  mcp:
    desc: Run the MCP server (debug)
    cmds:
      - swift run MicropodMCP

  cli:
    desc: Run the micropod CLI (debug)
    cmds:
      - swift run micropod

  api:
    desc: Run the local HTTP API (debug, http://127.0.0.1:45454)
    cmds:
      - swift run MicropodAPI

  shim:
    desc: Run the Docker Engine API shim (unix ~/.micropod/docker.sock + tcp :45455)
    cmds:
      - swift run micropod-docker-shim

  share-daemon:
    desc: Run the synchronized file-share daemon (unix ~/micropod/share-cache/socket)
    cmds:
      - swift run micropod-sharedfs

  test:
    desc: Run unit tests
    cmds:
      - task: proto
      - swift test

  validate:
    desc: Full deep validation (unit + integration + MCP e2e + app smoke)
    cmds:
      - task: proto
      - swift build
      - swift test
      - python3 scripts/mcp_e2e.py
      - ./scripts/app_smoke.sh

  e2e-real:
    desc: Real-runtime e2e tests (pulls + runs REAL containers on the Apple runtime, incl. docker-shim + ryuk reap, Connect caps/rosetta/privileged)
    cmds:
      - task: proto
      - swift build --product micropod-docker-shim
      - swift build --product MicropodAPI
      - MICROPOD_REAL_E2E=1 swift test --filter "RealRuntimeTests|RealShimTests|RealConnectCapsTests"

  bench:
    desc: Performance benchmark against the real runtime (CLI, decode, streaming, MCP, scale)
    cmds:
      - task: proto
      - swift build
      - swift run MicropodBench

  cli:
    desc: Build the micropod CLI (debug) + sign it with the virtualization entitlement `sandbox` needs
    cmds:
      - swift build --product micropod
      - codesign --force --sign - --entitlements signing/micropod-cli.entitlements .build/debug/micropod

  bench-runtimes:
    desc: CI-shaped boot/job/fan-out across execution options — sandbox, apple, machine, API, docker, shuru (if installed)
    cmds:
      - task: cli
      - python3 scripts/bench_runtimes.py {{.CLI_ARGS}}

  guest:
    desc: Build micropod-guest (the sandbox VMs' static linux/arm64 helper) next to the dev binaries
    cmds:
      - ./scripts/build_guest.sh

  guest-test:
    desc: Run micropod-guest's Go tests on a Linux kernel — inside a micropod sandbox
    cmds:
      - task: cli
      - .build/debug/micropod sandbox run -v "$PWD/guest:/src" -w /src -e GOFLAGS=-buildvcs=false -e GOTOOLCHAIN=local golang:"$(cat .go-version)" -- sh -c 'go vet ./... && go test -count=1 ./...'

  mcp-live:
    desc: The MCP server against this machine's real runtime, API daemon, app updater and metrics (MCP=~/.local/bin/micropod-mcp for the installed one)
    cmds:
      - swift build --product MicropodMCP
      - python3 scripts/mcp_live.py

  apiserver-contention:
    desc: Cuttlefish-shaped load (workspace volumes, clone creates, waits, deletes + pollers) against a scratch MicropodAPI; prints per-RPC latency and failures
    vars:
      PORT: '{{.PORT | default "45491"}}'
    cmds:
      - swift build --product MicropodAPI
      - |
        MICROPOD_API_PORT={{.PORT}} .build/debug/MicropodAPI > /tmp/micropod-contention-api.log 2>&1 &
        api=$!
        trap 'kill $api' EXIT
        for _ in $(seq 1 30); do curl -sf -m 2 -X POST -H 'content-type: application/json' -d '{}' http://127.0.0.1:{{.PORT}}/api/micropod.v1.SystemService/Ping >/dev/null && break; sleep 1; done
        python3 scripts/apiserver_contention.py --base http://127.0.0.1:{{.PORT}} {{.CLI_ARGS}}
        curl -s http://127.0.0.1:{{.PORT}}/metrics | grep micropod_apiserver_requests_total

  e2e-sdk:
    desc: TypeScript SDK Sandbox class (exec/spawn/files/watch/checkpoint) against a signed MicropodAPI on a scratch port
    cmds:
      - swift build --product MicropodAPI
      - ./scripts/build_guest.sh
      - ./scripts/e2e_sandbox_sdk.sh

  e2e-runtimes:
    desc: Live engine matrix (apple, sandbox, docker) through a signed MicropodAPI on a scratch port
    cmds:
      - swift build --product MicropodAPI
      - ./scripts/build_guest.sh
      - ./scripts/e2e_runtimes.sh

  bench-compose:
    desc: postgres compose startup — Micropod (Apple runtime) vs Docker Desktop
    cmds:
      - ./scripts/bench_compose_startup.sh

  bench-shim:
    desc: Docker Engine API latency + lifecycle — micropod-docker-shim vs Docker Desktop
    cmds:
      - |
        python3 scripts/bench_shim_vs_docker.py unix://$HOME/.micropod/docker.sock shim
        python3 scripts/bench_shim_vs_docker.py unix:///var/run/docker.sock docker

  api-go:
    desc: Run the connect-go API server (Go, http://127.0.0.1:45454)
    cmds:
      - cd api && go run ./cmd/micropod-apiserver

  api-go-test:
    desc: Run the connect-go API tests (mock CLI)
    cmds:
      - cd api && go test ./...

  hooks:
    desc: Install git hooks (pre-commit lint, pre-push build+test)
    cmds:
      - git config core.hooksPath .githooks
      - echo "hooks installed — pre-commit lints, pre-push runs swift build + test (--no-verify to skip)"

  lint:
    desc: Format check
    cmds:
      - swift format lint --strict --recursive Sources Tests Package.swift

  vmm-lint:
    desc: Lint the next-generation Rust/Go VMM workspace
    cmds:
      - cd vmm && cargo fmt --all -- --check
      - cd vmm && cargo clippy --workspace --all-targets -- -D warnings
      - cd vmm/guest-init && test -z "$(gofmt -l .)"
      - cd vmm/guest-init && env -u GOROOT go vet ./...
      - cd vmm/guest-init && env -u GOROOT GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go vet ./...

  vmm-test:
    desc: Test the next-generation Rust/Go VMM workspace
    cmds:
      - cd vmm && cargo test --workspace --all-targets -- --test-threads=1
      - cd vmm/guest-init && env -u GOROOT go test -count=1 ./...
      - cd vmm/guest-init && env -u GOROOT GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -o /tmp/micropod-vmm-guest-init-check . && rm -f /tmp/micropod-vmm-guest-init-check

  vmm-build:
    desc: Build, sign, and package the next-generation VMM and guest initramfs
    cmds:
      - cd vmm && ./build.sh

  format:
    desc: Format sources
    cmds:
      - swift format format --recursive --in-place Sources Tests Package.swift

  package:
    desc: Build + assemble release .app bundle (unsigned)
    cmds:
      - task: proto
      - ./scripts/package_app.sh

  install:
    desc: Package + install app to /Applications and MCP to ~/.local/bin, then launch
    cmds:
      - task: package
      - ./scripts/install.sh

  uninstall:
    desc: Remove the installed app + MCP server (leaves app data/preferences)
    cmds:
      - ./scripts/install.sh --uninstall

  bench-ci-apple:
    desc: Measure live OrbStack and the persistent Micropod worker on this Mac
    cmds:
      - bash scripts/bench_ci_apple.sh {{.CLI_ARGS}}

  ci-go:
    desc: Go CI pipeline on micropod (image build, vet, unit, race, testcontainers postgres, run)
    cmds:
      - ./ci/worker-pipeline.sh go

  ci-npm:
    desc: Node CI pipeline on micropod (image build, install+test, run, change-rebuild)
    cmds:
      - ./ci/worker-pipeline.sh npm

  ci:
    desc: Go and npm in parallel on one persistent Micropod Linux worker
    cmds:
      - ./ci/worker-pipeline.sh all

  ci-shim:
    desc: Qualify the isolated Apple Docker shim against the Go and npm pipelines
    cmds:
      - ./ci/pipeline-go.sh
      - ./ci/pipeline-npm.sh

  ci-matrix:
    desc: Build-cache re-use matrix (related Go/Node builds sharing deps, bases, mounts)
    cmds:
      - ./ci/cache-matrix.sh

  cache-eval-fast:
    desc: Fast deterministic Go/npm cache reuse gate; writes a normalized JSON/Markdown receipt and stores it in SQLite
    cmds:
      - mkdir -p .build/benchmarks/cache-eval
      - python3 scripts/bench_ci_cache_eval.py --layers host --clients 1 4 --rounds 2 --output .build/benchmarks/cache-eval/host.json --markdown .build/benchmarks/cache-eval/host.md --database "$HOME/.micropod/benchmarks/measurements.sqlite3" {{.CLI_ARGS}}

  cache-eval-worker:
    desc: Deep production-worker Go/npm cache evaluation, including scoped offline reuse, restart retention, and full CI pipelines
    cmds:
      - task: cli
      - mkdir -p .build/benchmarks/cache-eval
      - python3 scripts/bench_ci_cache_eval.py --layers host,worker --micropod .build/debug/micropod --worker-build-package-image --worker-pipelines --pipeline-rounds 1 --clients 1 4 --rounds 1 --output .build/benchmarks/cache-eval/worker.json --markdown .build/benchmarks/cache-eval/worker.md --database "$HOME/.micropod/benchmarks/measurements.sqlite3" {{.CLI_ARGS}}

  cache-eval-suite:
    desc: Realistic CI/cache suite (requires dist/micropod and the packaged HVF artifacts) normalized into the cache scorecard
    cmds:
      - mkdir -p .build/benchmarks/cache-eval
      - python3 scripts/bench_ci_cache_eval.py --layers suite --output .build/benchmarks/cache-eval/suite.json --markdown .build/benchmarks/cache-eval/suite.md --database "$HOME/.micropod/benchmarks/measurements.sqlite3" {{.CLI_ARGS}}

  cache-eval-hvf:
    desc: Full HVF cache matrix (requires QUAL_TOOLS and the packaged HVF runtime artifacts used by scripts/e2e_hvf_caches.sh)
    cmds:
      - mkdir -p .build/benchmarks/cache-eval
      - python3 scripts/bench_ci_cache_eval.py --layers hvf --output .build/benchmarks/cache-eval/hvf.json --markdown .build/benchmarks/cache-eval/hvf.md --database "$HOME/.micropod/benchmarks/measurements.sqlite3" {{.CLI_ARGS}}
