version: v2
clean: true
# SDK-generation template — emits the publishable client surfaces for
# TypeScript and Swift. Go gen lives in the main buf.gen.yaml (the api/
# module shares it via replace). All plugins remote so it runs anywhere;
# driven by scripts/gen-sdk.sh.
plugins:
  # TypeScript: protobuf-es v2 emits messages AND connect service stubs.
  # buf.validate options land in the embedded descriptors; the generated
  # files import the extension schema, which @bufbuild/protovalidate ships
  # (that package also powers the SDK's client-side validation interceptor).
  - remote: buf.build/bufbuild/es:v2.9.0
    out: sdk/ts/src/gen
    opt:
      - target=ts
      - import_extension=js
      - rewrite_imports=**/buf/validate/validate_pb.js:@bufbuild/protovalidate/gen
      # The protos annotate with (gnostic.openapi.v3.*) — no npm package ships
      # those types, so generated descriptors are pointed at the committed
      # stubs under src/vendor (outside gen/, where `clean` can't wipe them).
      - rewrite_imports=**/gnostic/openapi/v3/annotations_pb.js:../vendor
  # Swift: standalone copy for the MicropodSDK library target (kept
  # separate from MicropodCore/Generated so the SDK stays dependency-light).
  - remote: buf.build/apple/swift
    out: sdk/swift/Sources/MicropodSDK/Generated
    opt:
      - Visibility=public
