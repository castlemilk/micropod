version: v2
clean: true
plugins:
  - remote: buf.build/apple/swift
    out: Sources/MicropodCore/Generated
    opt:
      - Visibility=public
  - local: protoc-gen-go
    out: api/gen
    opt:
      - paths=source_relative
  - local: protoc-gen-connect-go
    out: api/gen
    opt:
      - paths=source_relative
  # Plain gRPC stubs so Go callers (cuttlefish) can drive vminitd's
  # SandboxContext over the vsock bridge with grpc-go.
  - local: protoc-gen-go-grpc
    out: api/gen
    opt:
      - paths=source_relative
