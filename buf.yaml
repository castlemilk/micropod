version: v2
modules:
  - path: proto
deps:
  - buf.build/bufbuild/protovalidate
lint:
  use:
    - STANDARD
  except:
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
    - RPC_REQUEST_RESPONSE_UNIQUE
  # Vendored upstream proto (apple/containerization SandboxContext) —
  # not ours to restyle.
  ignore:
    - proto/com/apple
breaking:
  use:
    - FILE
  ignore:
    - proto/com/apple
