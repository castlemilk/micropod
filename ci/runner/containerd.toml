version = 3

[plugins."io.containerd.cri.v1.runtime".containerd]
  default_runtime_name = "crun"
[plugins."io.containerd.cri.v1.runtime".containerd.runtimes.crun]
  runtime_type = "io.containerd.runc.v2"
[plugins."io.containerd.cri.v1.runtime".containerd.runtimes.crun.options]
  BinaryName = "/opt/micropod-oci/crun-1.31-arm64"

[plugins."io.containerd.cri.v1.runtime".cni]
  bin_dirs = ["/opt/micropod-oci/runner/cni"]

[plugins."io.containerd.cri.v1.runtime".containerd.runtimes.kata]
  runtime_type = "io.containerd.kata.v2"
  privileged_without_host_devices = true
  pod_annotations = []
  cni_conf_dir = "/etc/cni/micropod-private"

# Warnings and errors only: containerd logs to the guest's serial console,
# where every byte is a trapped register write. Its ~100 info lines at start
# (one per plugin) cost every boot, and so every payload switchover, ~25 ms,
# and each container start and exit adds more.
[debug]
  level = "warn"
  # Profiles only (net/http/pprof), root-only in the guest; the engine serves
  # them to the host at /micropod/debug/containerd/pprof/.
  address = "/run/containerd/debug.sock"
