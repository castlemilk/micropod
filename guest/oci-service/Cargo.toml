[package]
name = "micropod-oci"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
publish = false

[dependencies]
base64 = "0.22.1"
serde_json = "1.0.154"
libc = "0.2.189"

[profile.release]
strip = true
lto = "thin"

[target.'cfg(target_os = "linux")'.dependencies]
flate2 = "1"
sha2 = "0.10"
tar = { version = "0.4", default-features = false }
tempfile = "3"

[dev-dependencies]
flate2 = "1"
sha2 = "0.10"
tar = { version = "0.4", default-features = false }
tempfile = "3"
