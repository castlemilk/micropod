syntax = "proto3";

package micropod.v1;

option go_package = "github.com/castlemilk/micropod/sdk/go/gen/micropod/v1;micropodv1";

import "buf/validate/validate.proto";
import "micropod/v1/compose.proto";
import "micropod/v1/container.proto";
import "micropod/v1/image.proto";
import "micropod/v1/system.proto";

// The Micropod management API: container/image/volume/network operations on
// the Apple `container` runtime, served by the connect-go API server and
// consumable from any connect client (Go, Swift, TS, …).
service MicropodService {
  // Runtime status + disk usage.
  rpc GetSystem(Empty) returns (SystemSnapshot);
  // List all containers.
  rpc ListContainers(Empty) returns (ListContainersResponse);
  // Run a container (docker run).
  rpc RunContainer(RunContainerRequest) returns (ContainerRef);
  // Create a container without starting it (docker create).
  rpc CreateContainer(RunContainerRequest) returns (ContainerRef);
  // Start a stopped container.
  rpc StartContainer(ContainerRef) returns (Empty);
  // Stop a running container (SIGTERM, then SIGKILL after the grace period).
  rpc StopContainer(ContainerRef) returns (Empty);
  // Stop then start a container.
  rpc RestartContainer(ContainerRef) returns (Empty);
  // SIGKILL a running container.
  rpc KillContainer(ContainerRef) returns (Empty);
  // Remove a container. Running containers require force.
  rpc DeleteContainer(DeleteContainerRequest) returns (Empty);
  // Live log stream (server streaming).
  rpc StreamContainerLogs(StreamLogsRequest) returns (stream LogChunk);
  // List all local images.
  rpc ListImages(Empty) returns (ListImagesResponse);
  // Pull an image, streaming progress events.
  rpc PullImage(PullImageRequest) returns (stream ProgressLine);
  // Remove an image. Images in use require force.
  rpc DeleteImage(DeleteImageRequest) returns (Empty);
  // List all volumes.
  rpc ListVolumes(Empty) returns (ListVolumesResponse);
  // Create a named volume.
  rpc CreateVolume(CreateVolumeRequest) returns (Empty);
  // Remove a named volume.
  rpc DeleteVolume(DeleteVolumeRequest) returns (Empty);
  // List all container networks.
  rpc ListNetworks(Empty) returns (ListNetworksResponse);
  // Create a container network.
  rpc CreateNetwork(CreateNetworkRequest) returns (Empty);
  // Remove a container network.
  rpc DeleteNetwork(DeleteNetworkRequest) returns (Empty);
  // Point-in-time resource usage for all running containers.
  rpc GetStats(GetStatsRequest) returns (GetStatsResponse);
  // Run a command inside a running container and return its output.
  rpc Exec(ExecRequest) returns (ExecResponse);
  // What a cleanup would reclaim: images and volumes annotated with the
  // containers that reference them.
  rpc GetUsage(Empty) returns (UsageReport);
  // Named-volume mount policy applied on container create across every
  // surface (API, shim, app, CLI, MCP).
  rpc GetVolumePolicy(Empty) returns (VolumePolicy);
  // Replace the volume mount policy; returns the stored policy.
  rpc SetVolumePolicy(VolumePolicy) returns (VolumePolicy);
  // Trigger a background update check in the desktop app (Sparkle).
  // Fails with `unavailable` when the app isn't running.
  rpc CheckForUpdates(Empty) returns (UpdateStatus);
  // Last-known updater status from the desktop app.
  rpc GetUpdateStatus(Empty) returns (UpdateStatus);
  // Quit the app so a downloaded update installs and relaunches. Fails
  // with `failed_precondition` until `UpdateStatus.ready_to_install`.
  rpc ApplyUpdate(Empty) returns (UpdateStatus);
  // Run a compose spec file, streaming progress lines (server streaming).
  rpc ComposeUp(ComposeUpRequest) returns (stream ComposeUpEvent);
  // Tear down a compose project's containers.
  rpc ComposeDown(ComposeDownRequest) returns (Empty);
}

message Empty {}

message GetStatsRequest {}

message GetStatsResponse {
  // One stats snapshot covering every running container.
  StatsSnapshot snapshot = 1;
}

message SystemSnapshot {
  // Runtime health (status, versions, install paths).
  SystemStatus status = 1;
  // Disk usage grouped by resource kind.
  DiskUsage disk_usage = 2;
}

// Reference to an existing container (or the ID returned by run/create).
message ContainerRef {
  // Container ID — `container` uses the user-assigned name as the ID.
  string id = 1 [(buf.validate.field).required = true, (buf.validate.field).string.min_len = 1];
}

message ListContainersResponse {
  // Every container, in `container list` order.
  repeated Container containers = 1;
}

// Shared request shape for run + create (docker run / docker create).
message RunContainerRequest {
  // Image reference to run, e.g. "alpine:3.20". Pulled if not present locally.
  string image = 1 [(buf.validate.field).required = true, (buf.validate.field).string.min_len = 1];
  // Optional container name; becomes the container ID.
  optional string name = 2;
  // Return immediately instead of streaming/attaching.
  bool detach = 3;
  // CPU limit in cores, e.g. 0.5 for half a core.
  optional double cpus = 4 [(buf.validate.field).double.gt = 0];
  // Memory limit, e.g. "512m" or "4g".
  optional string memory = 5;
  // Environment variables as KEY=value pairs.
  repeated string env = 6;
  // Published port mappings (host → container).
  repeated PortMapping ports = 7;
  // Bind/volume mounts as "name-or-path:/mount" specs.
  repeated string volumes = 8;
  // Arbitrary metadata labels on the container.
  map<string, string> labels = 9;
  // Run an init process as PID 1 to reap zombies.
  bool init = 10;
  // Command + args override (image entrypoint is used when empty).
  repeated string arguments = 11;
}

message DeleteContainerRequest {
  // Container ID (or name).
  string id = 1 [(buf.validate.field).required = true, (buf.validate.field).string.min_len = 1];
  // Remove even if the container is still running.
  bool force = 2;
}

message StreamLogsRequest {
  // Container ID (or name) to stream logs from.
  string id = 1 [(buf.validate.field).required = true, (buf.validate.field).string.min_len = 1];
  // Number of lines to replay from the end of the log before following.
  int32 tail = 2 [(buf.validate.field).int32.gte = 0];
  // Include the vminitd guest boot log.
  bool boot = 3;
}

// One streamed log line (StreamContainerLogs event).
message LogChunk {
  // A single line of container output.
  string text = 1;
}

message ListImagesResponse {
  // Every local image, in `container image list` order.
  repeated Image images = 1;
}

message PullImageRequest {
  // Image reference to pull, e.g. "alpine:3.20" or a full registry path.
  string reference = 1 [(buf.validate.field).required = true, (buf.validate.field).string.min_len = 1];
  // Platform to pull, e.g. "linux/arm64". Defaults to the host platform.
  optional string platform = 2;
}

// One pull-progress event (PullImage stream).
message ProgressLine {
  // Human-readable progress text from the registry pull.
  string line = 1;
  // Current stage index (1-based), when the pull reports staged progress.
  optional int32 stage = 2;
  // Total number of stages, when known.
  optional int32 total_stages = 3;
}

message DeleteImageRequest {
  // Image reference or digest to remove.
  string reference = 1 [(buf.validate.field).required = true, (buf.validate.field).string.min_len = 1];
  // Remove even if containers reference the image.
  bool force = 2;
}

message ListVolumesResponse {
  // Every volume, in `container volume list` order.
  repeated Volume volumes = 1;
}

message CreateVolumeRequest {
  // Volume name.
  string name = 1 [(buf.validate.field).required = true, (buf.validate.field).string.min_len = 1];
  // Optional size limit, e.g. "10g".
  optional string size = 2;
  // Labels applied to the volume ("key=value").
  repeated string labels = 3;
  // Driver options passed through to the volume driver.
  repeated string options = 4;
}

message DeleteVolumeRequest {
  // Volume name to remove.
  string name = 1 [(buf.validate.field).required = true, (buf.validate.field).string.min_len = 1];
}

message ListNetworksResponse {
  // Every container network, in `container network list` order.
  repeated Network networks = 1;
}

message CreateNetworkRequest {
  // Network name.
  string name = 1 [(buf.validate.field).required = true, (buf.validate.field).string.min_len = 1];
  // Isolate the network from external traffic.
  bool internal = 2;
  // IPv4 CIDR for the network, e.g. "192.168.100.0/24".
  optional string subnet = 3;
  // IPv6 CIDR for the network.
  optional string subnet_v6 = 4;
  // Network driver/plugin to use.
  optional string driver = 5;
  // Driver options passed through to the network plugin.
  repeated string options = 6;
  // Labels applied to the network ("key=value").
  repeated string labels = 7;
}

message DeleteNetworkRequest {
  // Network name to remove.
  string name = 1 [(buf.validate.field).required = true, (buf.validate.field).string.min_len = 1];
}

message ExecRequest {
  // Container ID (or name) to exec into.
  string id = 1 [(buf.validate.field).required = true, (buf.validate.field).string.min_len = 1];
  // Command to run inside the container.
  string command = 2 [(buf.validate.field).required = true, (buf.validate.field).string.min_len = 1];
  // Working directory for the command.
  optional string workdir = 3;
  // Extra environment variables as KEY=value pairs.
  repeated string env = 4;
}

message ExecResponse {
  // Combined stdout (and stderr when not separable) of the command.
  string output = 1;
  // Guest process exit code. 0 on success; when the native runtime backend
  // is active this is the real exit status rather than a CLI approximation.
  int32 exit_code = 2;
  // Guest stderr, when the backend can separate the streams.
  string error = 3;
}
