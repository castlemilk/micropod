syntax = "proto3";

package micropod.v1;

import "buf/validate/validate.proto";
import "gnostic/openapi/v3/annotations.proto";
import "micropod/v1/api.proto";
import "micropod/v1/system.proto";

option go_package = "github.com/castlemilk/micropod/sdk/go/gen/micropod/v1;micropodv1";

// Container lifecycle, logs, stats, and exec against the Apple `container`
// runtime.
service ContainerService {
  // List all containers.
  rpc ListContainers(Empty) returns (ListContainersResponse);
  // Run a container (docker run).
  rpc RunContainer(RunContainerRequest) returns (ContainerRef);
  // Create a container without starting it (docker create).
  rpc CreateContainer(RunContainerRequest) returns (ContainerRef);
  // Start a stopped container.
  rpc StartContainer(ContainerRef) returns (Empty);
  // Stop a running container (SIGTERM, then SIGKILL after the grace period).
  rpc StopContainer(ContainerRef) returns (Empty);
  // Stop then start a container.
  rpc RestartContainer(ContainerRef) returns (Empty);
  // SIGKILL a running container.
  rpc KillContainer(ContainerRef) returns (Empty);
  // Remove a container. Running containers require force.
  rpc DeleteContainer(DeleteContainerRequest) returns (Empty);
  // Inspect one container by ID. Fails with `not_found` when no container
  // has that ID. `exit_code` is populated from the exit-code registry when
  // the native backend recorded the container's exit.
  rpc GetContainer(ContainerRef) returns (Container);
  // Block until the container exits or `timeout_seconds` elapses. Polls the
  // exit-code registry and runtime state server-side (no blocking runtime
  // wait); returns immediately when the container is already stopped.
  // Fails with `not_found` when no container has that ID.
  rpc WaitContainer(WaitContainerRequest) returns (WaitContainerResponse);
  // Live log stream (server streaming).
  rpc StreamContainerLogs(StreamLogsRequest) returns (stream LogChunk);
  // Point-in-time resource usage for all running containers.
  rpc GetStats(GetStatsRequest) returns (GetStatsResponse);
  // Run a command inside a running container and return its output.
  rpc Exec(ExecRequest) returns (ExecResponse) {
    option (gnostic.openapi.v3.operation) = {
      external_docs: {
        url: "https://docs.docker.com/reference/cli/docker/container/exec/"
        description: "docker exec semantics"
      }
    };
  }
}

// Curated view of a container, mapped from `container list --format json`.
message Container {
  // The container ID; `container` uses the user-assigned name as the ID.
  string id = 1 [(gnostic.openapi.v3.property).example = {yaml: "'web'"}];
  // Image reference the container was created from.
  string image = 2 [(gnostic.openapi.v3.property).example = {yaml: "'alpine:3.20'"}];
  // Lifecycle state: running, stopped, exited, created, ...
  string state = 3 [(gnostic.openapi.v3.property).example = {yaml: "'running'"}];
  // ISO8601 creation timestamp.
  string created_at = 4 [(gnostic.openapi.v3.property).example = {yaml: "'2026-01-15T10:30:00Z'"}, (gnostic.openapi.v3.property).format = "date-time"];
  // Configured CPU/memory limits.
  ContainerResources resources = 5;
  // Platform string, e.g. "linux/arm64".
  string platform = 6 [(gnostic.openapi.v3.property).example = {yaml: "'linux/arm64'"}];
  // Published host→container port mappings.
  repeated PortMapping published_ports = 7;
  // Mounted volumes and binds.
  repeated Mount mounts = 8;
  // Names of networks the container is attached to.
  repeated string networks = 9 [(gnostic.openapi.v3.property).example = {yaml: "['backend']"}];
  // Resolved IPv4 address on the container network, if running.
  string ipv4_address = 10 [(gnostic.openapi.v3.property).example = {yaml: "'192.168.64.3'"}, (gnostic.openapi.v3.property).format = "ipv4"];
  // Environment variables as KEY=value pairs.
  repeated string env = 11;
  // Metadata labels on the container.
  map<string, string> labels = 12;
  // Runs x86_64 binaries via Rosetta translation.
  bool rosetta = 13;
  // Root filesystem is read-only.
  bool read_only = 14;
  // An init process runs as PID 1 inside the container.
  bool use_init = 15;
  // SSH access is enabled for the container.
  bool ssh = 16;
  // Uses full virtualization rather than the container runtime path.
  bool virtualization = 17;
  // OCI runtime handler in use, if any.
  string runtime_handler = 18;
  // Exit code once the container has stopped.
  string exit_code = 19;
  // Execution engine that owns this container: "apple", "docker" or
  // "sandbox" (see SystemService.ListRuntimes). Id-based calls are routed
  // to this engine.
  string runtime = 20 [(gnostic.openapi.v3.property).example = {yaml: "'apple'"}];
}

message ContainerResources {
  // CPU limit in cores.
  double cpus = 1 [(gnostic.openapi.v3.property).example = {yaml: "2"}];
  // Memory limit in bytes.
  uint64 memory_bytes = 2 [(gnostic.openapi.v3.property).example = {yaml: "536870912"}];
}

// A published port mapping between host and container.
message PortMapping {
  // Port on the host.
  uint32 host_port = 1 [(buf.validate.field).uint32.lte = 65535, (gnostic.openapi.v3.property).example = {yaml: "8080"}];
  // Port inside the container.
  uint32 container_port = 2 [(buf.validate.field).required = true, (buf.validate.field).uint32.lte = 65535];
  // "tcp" or "udp".
  string protocol = 3 [(gnostic.openapi.v3.property).example = {yaml: "'tcp'"}];
  // Host interface IP to bind (empty = all interfaces).
  string host_ip = 4 [(gnostic.openapi.v3.property).example = {yaml: "'127.0.0.1'"}, (gnostic.openapi.v3.property).format = "ipv4"];
}

// A volume or bind mount inside the container.
message Mount {
  // Mount kind: "volume" or "bind".
  string type = 1 [(gnostic.openapi.v3.property).example = {yaml: "'volume'"}];
  // Volume name or host path.
  string source = 2 [(gnostic.openapi.v3.property).example = {yaml: "'data'"}];
  // Path inside the container.
  string destination = 3 [(gnostic.openapi.v3.property).example = {yaml: "'/data'"}];
  // Mount is read-only.
  bool read_only = 4;
}

// Reference to an existing container (or the ID returned by run/create).
message ContainerRef {
  // Container ID — `container` uses the user-assigned name as the ID.
  string id = 1 [(buf.validate.field).required = true, (buf.validate.field).string.min_len = 1, (gnostic.openapi.v3.property).example = {yaml: "'web'"}];
}

message ListContainersResponse {
  // Every container, in `container list` order.
  repeated Container containers = 1;
}

// Shared request shape for run + create (docker run / docker create).
message RunContainerRequest {
  // Image reference to run, e.g. "alpine:3.20". Pulled if not present locally.
  string image = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1,
    (gnostic.openapi.v3.property).example = {yaml: "'alpine:3.20'"}
  ];
  // Optional container name; becomes the container ID.
  optional string name = 2 [(gnostic.openapi.v3.property).example = {yaml: "'web'"}];
  // Return immediately instead of streaming/attaching.
  bool detach = 3 [(gnostic.openapi.v3.property).example = {yaml: "true"}];
  // CPU limit in cores, e.g. 0.5 for half a core.
  optional double cpus = 4 [(buf.validate.field).double.gt = 0, (gnostic.openapi.v3.property).example = {yaml: "2"}];
  // Memory limit, e.g. "512m" or "4g".
  optional string memory = 5 [(gnostic.openapi.v3.property).example = {yaml: "'512m'"}];
  // Environment variables as KEY=value pairs.
  repeated string env = 6 [(gnostic.openapi.v3.property).example = {yaml: "['DEBUG=true']"}];
  // Published port mappings (host → container).
  repeated PortMapping ports = 7;
  // Bind/volume mounts as "name-or-path:/mount" specs.
  repeated string volumes = 8 [(gnostic.openapi.v3.property).example = {yaml: "['data:/data']"}];
  // Arbitrary metadata labels on the container.
  map<string, string> labels = 9;
  // Run an init process as PID 1 to reap zombies.
  bool init = 10;
  // Command + args override (image entrypoint is used when empty).
  repeated string arguments = 11 [(gnostic.openapi.v3.property).example = {yaml: "['echo', 'hello']"}];
  // Entrypoint override (docker run --entrypoint); `arguments` become its args.
  optional string entrypoint = 12 [(gnostic.openapi.v3.property).example = {yaml: "'/bin/sh'"}];
  // Platform to select from a multi-arch image, e.g. "linux/arm64".
  optional string platform = 13 [(gnostic.openapi.v3.property).example = {yaml: "'linux/arm64'"}];
  // Working directory inside the container (docker run --workdir).
  optional string workdir = 14 [(gnostic.openapi.v3.property).example = {yaml: "'/work'"}];
  // User (and optional group) to run as, e.g. "1000:1000" (docker run --user).
  optional string user = 15 [(gnostic.openapi.v3.property).example = {yaml: "'1000:1000'"}];
  // Fail with `not_found` instead of pulling when the image is absent
  // locally (for the requested `platform`, when set). Lets callers own the
  // pull and bound its duration.
  bool no_pull = 16 [(gnostic.openapi.v3.property).example = {yaml: "true"}];
  // Linux capabilities to add to the container's default set (docker run
  // --cap-add). Names are case-insensitive, with or without the `CAP_`
  // prefix ("NET_ADMIN" == "cap_net_admin"); "ALL" grants every capability.
  // Unknown names fail with `invalid_argument`. The server normalises names
  // to the `CAP_*` spelling before handing them to the runtime.
  repeated string cap_add = 17 [
    (buf.validate.field).repeated.max_items = 64,
    (buf.validate.field).repeated.items.string.pattern = "^([Cc][Aa][Pp]_)?[A-Za-z][A-Za-z_]*$",
    (buf.validate.field).repeated.items.string.max_len = 32,
    (gnostic.openapi.v3.property).example = {yaml: "['NET_ADMIN', 'SYS_PTRACE']"}
  ];
  // Linux capabilities to remove from the container's set (docker run
  // --cap-drop). Same spelling rules as `cap_add`; "ALL" drops every
  // capability, so `cap_add` can then grant back a minimal set. Drops always
  // win over an "ALL" grant — `cap_add: ["ALL"]` or `privileged` — so
  // `privileged` + `cap_drop: ["SYS_MODULE"]` runs with every capability but
  // SYS_MODULE. "ALL" here together with `privileged` or `cap_add: ["ALL"]`
  // is contradictory and fails with `invalid_argument`.
  repeated string cap_drop = 18 [
    (buf.validate.field).repeated.max_items = 64,
    (buf.validate.field).repeated.items.string.pattern = "^([Cc][Aa][Pp]_)?[A-Za-z][A-Za-z_]*$",
    (buf.validate.field).repeated.items.string.max_len = 32,
    (gnostic.openapi.v3.property).example = {yaml: "['NET_RAW']"}
  ];
  // Run x86_64 (linux/amd64) binaries through Rosetta translation (container
  // run --rosetta). `true` forces Rosetta on. Unset or `false` keeps the
  // server default: the native backend turns Rosetta on by itself when the
  // selected image variant is amd64 on an Apple silicon host. Rosetta does
  // not select an image variant — pair it with `platform: "linux/amd64"` to
  // run the amd64 variant of a multi-arch image.
  optional bool rosetta = 19 [(gnostic.openapi.v3.property).example = {yaml: "true"}];
  // Run the workload with the privileges a nested container engine
  // (dockerd, containerd, buildkitd) needs — the micro-VM analogue of
  // docker run --privileged: every Linux capability (as `cap_add: ["ALL"]`)
  // and none of the runtime's default read-only or masked paths, so
  // /proc/sys (IP forwarding, sysctls) and /sys/fs/cgroup are writable and
  // /proc is not masked. The isolation boundary stays the micro-VM: host
  // devices are not passed through. Named `cap_drop` entries still remove
  // their capabilities; `cap_drop: ["ALL"]` with `privileged` fails with
  // `invalid_argument`.
  optional bool privileged = 20 [(gnostic.openapi.v3.property).example = {yaml: "true"}];
  // Execution engine to run on: "apple" (a micro-VM per container via the
  // Apple container runtime), "docker" (a Docker Engine socket) or
  // "sandbox" (an ephemeral in-process micro-VM booted from a cached
  // rootfs clone). Unset uses the server default (SetDefaultRuntime). An
  // unknown or unavailable engine fails with `failed_precondition`.
  optional string runtime = 21 [
    (buf.validate.field).string.pattern = "^[a-z][a-z0-9-]*$",
    (gnostic.openapi.v3.property).example = {yaml: "'sandbox'"}
  ];
  // Sandbox-only behaviour — host ports the guest may reach, an egress
  // allowlist, proxy-injected secrets. Honoured by `runtime: "sandbox"`;
  // other engines fail the request with `unimplemented` rather than drop it.
  SandboxOptions sandbox = 22;
}

// What a sandbox may reach beyond its own VM, and the credentials it may use
// without seeing them.
message SandboxOptions {
  // Host loopback ports the guest reaches as host.micropod.internal:<port>
  // (e.g. a database on the host). Nothing else on the host is reachable.
  repeated uint32 expose_host = 1 [
    (buf.validate.field).repeated.max_items = 64,
    (buf.validate.field).repeated.items.uint32 = {gt: 0, lte: 65535},
    (gnostic.openapi.v3.property).example = {yaml: "[5432]"}
  ];
  // Egress allowlist. When set, the VM has no route out of its own: all
  // traffic leaves through a host proxy that refuses every other host.
  // "*.example.com" matches subdomains only. Needs a network.
  repeated string allow_hosts = 2 [
    (buf.validate.field).repeated.max_items = 256,
    (buf.validate.field).repeated.items.string = {min_len: 1, max_len: 253},
    (gnostic.openapi.v3.property).example = {yaml: "['api.openai.com', '*.npmjs.org']"}
  ];
  // Secrets by the environment variable name the guest sees. The guest gets
  // a random placeholder; the host proxy swaps in the real value only in the
  // request line and headers of HTTPS requests to the secret's `hosts`, so
  // the credential never enters the VM. Needs a network.
  map<string, SandboxSecret> secrets = 3 [
    (buf.validate.field).map.max_pairs = 64,
    (buf.validate.field).map.keys.string.pattern = "^[A-Za-z_][A-Za-z0-9_]*$"
  ];
  // Guest nameservers (default: the network gateway). Needs a network.
  repeated string dns_resolvers = 4 [
    (buf.validate.field).repeated.max_items = 8,
    (buf.validate.field).repeated.items.string.ip = true,
    (gnostic.openapi.v3.property).example = {yaml: "['1.1.1.1']"}
  ];
  // Root disk size in MiB for image bases (0 = the default, 8192).
  uint64 disk_size_mib = 5 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).uint64 = {gte: 512, lte: 1048576}
  ];
}

// One secret: its current value and the hosts that may receive it. The API
// never runs programs on the host: to use a minted, expiring credential
// (`gcloud auth print-access-token`, a GitHub App token), mint it on the
// caller's side — the SDKs do this for `command` secrets — and push each
// new value with SandboxService.UpdateSandboxSecret.
message SandboxSecret {
  // The real value. SDKs read `from` environment variables on the caller's
  // side and send the value here. CR, LF and NUL are refused.
  string value = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
  // Not accepted: the API doesn't run host commands (removed in v0.11 for
  // that reason; requests that set it fail with `invalid_argument`).
  repeated string command = 2 [deprecated = true];
  // Not accepted (see `command`).
  string command_dir = 3 [deprecated = true];
  // Not accepted (see `command`).
  string ttl = 4 [deprecated = true];
  // HTTPS hosts whose requests get the real value ("*.example.com" matches
  // subdomains).
  repeated string hosts = 5 [
    (buf.validate.field).repeated.min_items = 1,
    (buf.validate.field).repeated.max_items = 64,
    (buf.validate.field).repeated.items.string = {min_len: 1, max_len: 253},
    (gnostic.openapi.v3.property).example = {yaml: "['api.openai.com']"}
  ];
  // When `value` stops working (RFC 3339). After it, requests to `hosts` fail
  // closed (502) until UpdateSandboxSecret supplies a new value. Empty: the
  // value doesn't expire.
  string expires_at = 6 [(gnostic.openapi.v3.property).example = {yaml: "'2026-10-01T12:00:00Z'"}];
}

message WaitContainerRequest {
  // Container ID (or name) to wait on.
  string id = 1 [(buf.validate.field).required = true, (buf.validate.field).string.min_len = 1, (gnostic.openapi.v3.property).example = {yaml: "'web'"}];
  // Seconds to wait for the container to exit. 0 selects the server default
  // (30); values above 300 are capped at 300.
  int32 timeout_seconds = 2 [(buf.validate.field).int32.gte = 0, (gnostic.openapi.v3.property).example = {yaml: "30"}];
}

message WaitContainerResponse {
  // True when the container is no longer running or stopping.
  bool exited = 1 [(gnostic.openapi.v3.property).example = {yaml: "true"}];
  // True when `exit_code` is authoritative (recorded by the exit-code
  // registry). False for containers the server did not start itself or
  // whose entry aged out.
  bool known = 2 [(gnostic.openapi.v3.property).example = {yaml: "true"}];
  // Process exit code; only meaningful when `known` is true.
  int32 exit_code = 3 [(gnostic.openapi.v3.property).example = {yaml: "0"}];
  // Runtime state observed at return: running, stopping, stopped, created
  // or unknown.
  string state = 4 [(gnostic.openapi.v3.property).example = {yaml: "'stopped'"}];
}

message DeleteContainerRequest {
  // Container ID (or name).
  string id = 1 [(buf.validate.field).required = true, (buf.validate.field).string.min_len = 1, (gnostic.openapi.v3.property).example = {yaml: "'web'"}];
  // Remove even if the container is still running.
  bool force = 2 [(gnostic.openapi.v3.property).example = {yaml: "true"}];
}

message StreamLogsRequest {
  // Container ID (or name) to stream logs from.
  string id = 1 [(buf.validate.field).required = true, (buf.validate.field).string.min_len = 1, (gnostic.openapi.v3.property).example = {yaml: "'web'"}];
  // Number of lines to replay from the end of the log before following.
  int32 tail = 2 [(buf.validate.field).int32.gte = 0, (gnostic.openapi.v3.property).example = {yaml: "200"}];
  // Include the vminitd guest boot log.
  bool boot = 3;
  // Number of lines to drop from the start of the stream (after `tail` is
  // applied). Lets a client re-open a stream after a transport error
  // without replaying lines it already delivered.
  int64 skip_lines = 4 [(buf.validate.field).int64.gte = 0, (gnostic.openapi.v3.property).example = {yaml: "120"}];
}

// One streamed log line (StreamContainerLogs event).
message LogChunk {
  // A single line of container output.
  string text = 1 [(gnostic.openapi.v3.property).example = {yaml: "'GET /healthz 200'"}];
}

message GetStatsRequest {
  // Restrict the snapshot to these container IDs. Empty means every running
  // container. The native backend samples only the requested IDs.
  repeated string ids = 1 [(gnostic.openapi.v3.property).example = {yaml: "['web']"}];
}

message GetStatsResponse {
  // One stats snapshot covering every running container.
  StatsSnapshot snapshot = 1;
}

message ExecRequest {
  // Container ID (or name) to exec into.
  string id = 1 [(buf.validate.field).required = true, (buf.validate.field).string.min_len = 1, (gnostic.openapi.v3.property).example = {yaml: "'web'"}];
  // Command line to run inside the container, split on whitespace. Used only
  // when `arguments` is empty; one of the two must be set (handlers reject
  // an empty request with `invalid_argument`).
  string command = 2 [(gnostic.openapi.v3.property).example = {yaml: "'/bin/sh'"}];
  // Working directory for the command.
  optional string workdir = 3 [(gnostic.openapi.v3.property).example = {yaml: "'/app'"}];
  // Extra environment variables as KEY=value pairs.
  repeated string env = 4 [(gnostic.openapi.v3.property).example = {yaml: "['TERM=xterm']"}];
  // Verbatim argv to run inside the container. Takes precedence over
  // `command` when non-empty; elements are passed through unsplit.
  repeated string arguments = 5 [(gnostic.openapi.v3.property).example = {yaml: "['sh', '-c', 'echo a  b']"}];
}

message ExecResponse {
  // Combined stdout (and stderr when not separable) of the command.
  string output = 1 [(gnostic.openapi.v3.property).example = {yaml: "'hello\n'"}];
  // Guest process exit code. 0 on success; when the native runtime backend
  // is active this is the real exit status rather than a CLI approximation.
  int32 exit_code = 2 [(gnostic.openapi.v3.property).example = {yaml: "0"}];
  // Guest stderr, when the backend can separate the streams.
  string error = 3;
}
