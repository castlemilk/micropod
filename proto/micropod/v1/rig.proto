syntax = "proto3";

package micropod.v1;

option go_package = "github.com/castlemilk/micropod/sdk/go/gen/micropod/v1;micropodv1";

import "buf/validate/validate.proto";
import "micropod/v1/api.proto";

// The rootless rig: which execution mode new workloads use, the shared hvf
// machine's state and lifecycle, and its versioned payload (VMM, kernel,
// initrd, guest tools). The machine is the one MICROPOD_HVF_ROOT names for
// the API process. The REST routes under /v1/rig answer the same data.
service RigService {
  // Mode, machine phase, cache disk and policy summary, staged payloads and
  // the local dependency proxy (GET /v1/rig/health).
  rpc GetRigHealth(Empty) returns (RigHealth);
  // The execution mode in force (GET /v1/rig/mode).
  rpc GetRigMode(Empty) returns (RigMode);
  // Switch mode: container (the shared hvf machine) or sandbox (one micro-VM
  // per workload). Writes the default runtime (PUT /v1/rig/mode).
  rpc SetRigMode(SetRigModeRequest) returns (RigMode);
  // Active, staged and known-good payloads (GET /v1/rig/hvf/update).
  rpc GetHVFUpdateStatus(Empty) returns (HVFUpdateStatus);
  // Activate the staged payload: restart the machine onto it, probe it, and
  // return to known-good if it fails. Deferred (`failed_precondition`, nothing
  // stopped) while containers run or idleness cannot be confirmed, unless
  // `force`.
  rpc ApplyHVFUpdate(HVFUpdateRequest) returns (HVFUpdateResult);
  // Return to the last known-good payload (POST /v1/rig/hvf/update/rollback),
  // deferred like ApplyHVFUpdate.
  rpc RollbackHVFUpdate(HVFUpdateRequest) returns (HVFUpdateResult);
  // The machine as every process sees it: assets, supervisor, phase, the
  // published state, and its autostart LaunchAgent. Never boots anything;
  // while it runs, the guest is asked for its engine version, its
  // containers and its cache disk (one second each).
  rpc GetMachineStatus(Empty) returns (HVFMachineStatus);
  // What the hvf machine has, what is in use, how hard it is being pushed
  // and how many more containers it can take now: the figures a scheduler
  // admits work by. One request to the guest engine, which answers from its
  // own counters and a once-a-second sample of the kernel's (no subprocess,
  // no listing); the Mac's memory pressure is read in this process. Never
  // boots anything: unavailable while the machine does not serve.
  rpc GetMachineCapacity(Empty) returns (MachineCapacity);
  // Start (returns once the guest answers), stop (a stop on request: Ping and
  // GetSystem then say stopped and nothing restarts it on demand) or restart
  // the machine; replies with its status afterwards. Stop and restart are
  // deferred (`failed_precondition`, nothing stopped) while containers run on
  // a serving machine or its idleness cannot be confirmed, unless `force`.
  rpc ControlMachine(ControlMachineRequest) returns (HVFMachineStatus);
  // Turn the machine's autostart LaunchAgent on or off (`micropod machine
  // autostart on|off`): on, launchd starts the machine at login and stops it
  // cleanly at logout. Loading or unloading the job restarts a running
  // machine, so it is deferred (`failed_precondition`, nothing changed)
  // while containers run, unless `force`. Replies with the machine status.
  rpc SetMachineAutostart(SetMachineAutostartRequest) returns (HVFMachineStatus);
  // The machine's first run (`micropod setup`): its runtime files from the
  // API's own app bundle or CLI package (or `payload_path`), its disk from
  // `disk_from` or the package's base disk, and its cache disk; then a start
  // when `start`. Local sources only: nothing is downloaded. Re-running
  // keeps what is there. A step that cannot be done is a failed step in the
  // reply (`ok` false), never a partial install: every source is checked
  // before anything is written.
  rpc SetupMachine(SetupMachineRequest) returns (SetupMachineResult);
}

message RigModeOption {
  // container or sandbox.
  string name = 1;
  // The engine the mode runs on (hvf, sandbox).
  string engine = 2;
  string summary = 3;
}

message RigMode {
  // The active mode, or the default runtime's name when it maps to no mode.
  string mode = 1;
  string default_runtime = 2;
  repeated RigModeOption modes = 3;
}

message SetRigModeRequest {
  // container or sandbox (an engine name is accepted too).
  string mode = 1 [(buf.validate.field).string.min_len = 1];
}

// The cache disk as rig health reports it: the guest's account when it
// answered, else why it is unknown.
message RigCacheDisk {
  bool mounted = 1;
  // The host has caches.ext4, so the VMM attaches it.
  bool configured = 2;
  // machine.json expects a cache disk that is gone.
  optional string missing = 3;
  // guest, or unknown when the guest did not answer.
  string source = 4;
  // Why the state is unknown.
  optional string reason = 5;
  optional string state = 6;
  optional string device = 7;
  optional string mount_info_error = 8;
  optional uint64 size_bytes = 9;
  optional uint64 free_bytes = 10;
  // on, off or unknown.
  string shared_caches = 11;
  // Why shared caches are off this boot.
  optional string unavailable = 12;
  string summary = 13;
}

message RigHVFHealth {
  bool installed = 1;
  // starting, running, stopping, stopped or failed.
  string phase = 2;
  string summary = 3;
  string root = 4;
  string docker_endpoint = 5;
  bool cache_disk_present = 6;
  RigCacheDisk cache_disk = 7;
  string shared_caches = 8;
  bool update_pending = 9;
  string payload_version = 10;
}

message RigCachePolicySummary {
  string mode = 1;
  bool shared_l0 = 2;
  string default_trust = 3;
  string go_proxy = 4;
  int32 tool_count = 5;
  // trusted or any: which containers may be given a Docker socket
  // (CachePolicy.docker_socket as the guest applies it).
  string docker_socket = 6;
  // job or none: what a container naming no limit gets
  // (CachePolicy.default_limits as the guest applies it).
  string default_limits = 7;
}

message RigDepproxy {
  string url = 1;
  bool healthy = 2;
}

message RigHealth {
  string mode = 1;
  string default_runtime = 2;
  RigHVFHealth hvf = 3;
  RigCachePolicySummary cache_policy = 4;
  RigDepproxy depproxy = 5;
  // machine.json did not load: the policy summary shows the defaults' values.
  optional string config_error = 6;
}

// One payload's manifest.
message HVFPayloadManifest {
  int32 schema = 1;
  string version = 2;
  string revision = 3;
  // RFC 3339.
  string installed_at = 4;
  map<string, string> digests = 5;
  // Unset for a staged release; "flat" for an imported flat install.
  optional string origin = 6;
}

message HVFUpdateStatus {
  // What a newly started supervisor boots (unset: the flat layout).
  optional string current_path = 1;
  optional string previous_path = 2;
  // Staged and waiting for ApplyHVFUpdate.
  optional string staged_path = 3;
  // The last payload that booted and passed the health probes.
  optional string known_good_path = 4;
  HVFPayloadManifest current = 5;
  HVFPayloadManifest previous = 6;
  HVFPayloadManifest staged = 7;
  HVFPayloadManifest known_good = 8;
  optional string running_path = 9;
  optional string running_version = 10;
  optional string running_revision = 11;
  // An activation would change what runs.
  bool update_pending = 12;
  repeated string available_versions = 13;
  // Why the last apply of the payload still staged failed.
  optional string last_activation_failure = 14;
}

message HVFUpdateRequest {
  // Restart even while containers run (interrupts them).
  bool force = 1;
}

message HVFUpdateResult {
  // noop, activated, rolled_back (success); failed_rollback and failed come
  // back as errors, deferred as `failed_precondition`.
  string action = 1;
  optional string from_version = 2;
  optional string to_version = 3;
  // Workloads that held off a restart.
  int32 active_containers = 4;
  string detail = 5;
  optional string target_version = 6;
  optional int64 switchover_milliseconds = 7;
}

message HVFMachineState {
  string phase = 1;
  int32 supervisor_pid = 2;
  optional int32 vmm_pid = 3;
  // RFC 3339.
  optional string started_at = 4;
  optional string ready_at = 5;
  int32 restart_count = 6;
  optional string last_exit_reason = 7;
  optional int32 last_exit_code = 8;
  optional string loaded_payload_path = 9;
  optional string loaded_payload_version = 10;
  string updated_at = 11;
}

message HVFMachineStatus {
  string root = 1;
  // The guest Docker socket.
  string socket = 2;
  // Missing assets by layout name; empty once installed.
  repeated string missing = 3;
  bool installed = 4;
  // Why an installed layout still cannot host the machine.
  optional string problem = 5;
  bool supervisor_alive = 6;
  // The effective phase: stopped (or failed) whenever no supervisor holds
  // the lock, whatever a stale state file says.
  string phase = 7;
  // The supervisor's last published state.
  HVFMachineState state = 8;
  // state.json exists but could not be read.
  optional string state_error = 9;
  bool update_pending = 10;
  // One line, as `micropod machine status` prints it.
  string summary = 11;
  // The last machine stop was asked for: nothing starts it on demand.
  bool stopped_on_request = 12;
  // The guest engine's /version, read only while the machine runs.
  optional string engine_version = 13;
  // The newest and oldest Docker API versions the engine serves.
  optional string engine_api_version = 14;
  optional string engine_min_api_version = 15;
  // Each disk's flush mode now and at the next start, as `micropod machine
  // status` prints it.
  string disk_flush = 16;
  // The machine's containers (all, and running), read only while it runs.
  optional int32 containers_total = 17;
  optional int32 containers_running = 18;
  // running, starting, stopping, stopped, failed, not-ready, not-installed
  // or unusable: whether it can take work now.
  string readiness = 19;
  // Why it is failed, unusable, not ready or not installed.
  optional string failure_reason = 20;
  RigCacheDisk cache_disk = 21;
  HVFMachineAutostart autostart = 22;
  // unix:// socket for DOCKER_HOST and the `micropod` docker context.
  string docker_endpoint = 23;
  // The payload that runs (or the next start boots) and the one staged.
  optional string payload_version = 24;
  optional string staged_version = 25;
}

// The machine's autostart LaunchAgent (`micropod machine autostart`).
message HVFMachineAutostart {
  // On: launchd starts the machine at login.
  bool enabled = 1;
  // launchd has the job loaded now.
  bool loaded = 2;
  string label = 3;
  string plist_path = 4;
  optional string program = 5;
  // launchd's SIGTERM -> SIGKILL wait, in seconds.
  optional int32 exit_timeout_seconds = 6;
  // Why the job cannot start the machine as recorded.
  optional string problem = 7;
  string summary = 8;
}

message SetMachineAutostartRequest {
  bool enabled = 1;
  // Restart a machine that runs containers (interrupts them).
  bool force = 2;
}

message SetupMachineRequest {
  // An app bundle, or a directory holding micropod-vmm, vmlinux-hvf,
  // mp-hvf-init.cpio and micropod-oci-tools (and maybe hvf-base-disk.ext4);
  // empty: the API's own package.
  string payload_path = 1;
  // A local ext4 image the disk is cloned (or copied) from; empty: the
  // package's base disk.
  string disk_from = 2;
  // The cache disk's size; 0: 32 GiB for a new machine.
  uint64 cache_disk_bytes = 3;
  // No cache disk: the dependency caches live on the OS disk.
  bool no_cache_disk = 4;
  // Boot the machine once it is installed (returns once the guest answers).
  bool start = 5;
}

// One setup step.
message SetupMachineStep {
  // runtime-files, disk, cache-disk, start or default-runtime.
  string id = 1;
  // done, kept (already there), skipped (not asked for), failed, or pending
  // (not reached: an earlier step failed).
  string state = 2;
  // What it did, or why it failed.
  string detail = 3;
}

message SetupMachineResult {
  // No step failed.
  bool ok = 1;
  repeated SetupMachineStep steps = 2;
  // The machine afterwards.
  HVFMachineStatus machine = 3;
}

message ControlMachineRequest {
  string action = 1 [(buf.validate.field).string = {in: ["start", "stop", "restart"]}];
  // Stop or restart even while containers run (interrupts them).
  bool force = 2;
}

// The hvf machine's capacity, load and headroom (GetMachineCapacity).
message MachineCapacity {
  // When the guest sampled its kernel figures (Unix milliseconds). The
  // container counts and the engine's own counters are of the request.
  int64 sampled_unix_ms = 1;
  // What the machine has.
  uint32 cpus = 2;
  uint64 memory_bytes = 3;
  // The most tasks (processes and threads) the guest kernel runs at once.
  uint64 pid_max = 4;
  // The most containers running at once the headroom is counted against.
  uint32 max_containers = 5;
  // The most containers one delegated Docker socket may hold at once.
  uint32 family_containers_max = 6;
  // The most gateway relay connections (published ports reached from
  // containers) the engine holds at once.
  uint32 relay_connections_max = 7;
  MachineUsage usage = 8;
  MachineContainers containers = 9;
  MachineEngineLoad engine = 10;
  MachinePressure pressure = 11;
  MachineDisk os_disk = 12;
  // Unset when the machine has no cache disk.
  optional MachineDisk cache_disk = 13;
  MachineHeadroom headroom = 14;
  MachineHost host = 15;
}

message MachineUsage {
  // The share of all CPUs busy over the second before the sample (0..1),
  // and the same as a number of CPUs.
  double cpu_busy_fraction = 1;
  double cpu_busy_cpus = 2;
  double load1 = 3;
  double load5 = 4;
  double load15 = 5;
  // Tasks runnable now, and all tasks.
  uint32 runnable = 6;
  uint32 tasks = 7;
  uint64 memory_available_bytes = 8;
  uint64 memory_used_bytes = 9;
  uint64 swap_used_bytes = 10;
  uint64 open_files = 11;
  uint64 conntrack_entries = 12;
  uint32 relay_connections = 13;
}

message MachineContainers {
  uint32 total = 1;
  uint32 running = 2;
  uint32 starting = 3;
  uint32 created = 4;
  uint32 exited = 5;
  // The CPU limits (thousandths of a CPU) and memory limits of the running
  // and starting containers, summed; without_cpu_limit counts those with no
  // CPU limit, which the sum leaves out, as it does a memory limit of the
  // whole machine.
  int64 requested_milli_cpu = 6;
  int64 requested_memory_bytes = 7;
  uint32 without_cpu_limit = 8;
  // By family, the largest first, at most 64 rows (the rest summed as
  // "(other)"). A family is a delegated Docker socket's owner and what it
  // created, named by the owner's io.micropod.family label or its name; or
  // every container the host created with the same io.micropod.family
  // label; "" is what the host created without one.
  repeated MachineFamily families = 9;
}

message MachineFamily {
  string name = 1;
  uint32 running = 2;
  uint32 total = 3;
  int64 requested_milli_cpu = 4;
  int64 requested_memory_bytes = 5;
}

message MachineEngineLoad {
  uint32 creates_in_flight = 1;
  uint32 starts_in_flight = 2;
  // Over the latest starts_sampled starts (256 at most): from the start
  // request to the container's process running, in milliseconds.
  uint32 start_p50_ms = 3;
  uint32 start_p95_ms = 4;
  uint32 starts_sampled = 5;
}

// The guest kernel's pressure stall information: the percentage of the last
// 10, 60 and 300 seconds in which some, or all, tasks were stalled on a
// resource. available is false on a kernel without it.
message MachinePressure {
  bool available = 1;
  PressureResource cpu = 2;
  PressureResource memory = 3;
  PressureResource io = 4;
}

message PressureResource {
  PressureAverages some = 1;
  PressureAverages full = 2;
}

message PressureAverages {
  double avg10 = 1;
  double avg60 = 2;
  double avg300 = 3;
}

message MachineDisk {
  uint64 total_bytes = 1;
  uint64 free_bytes = 2;
}

// How many more typical containers the machine can take now.
//
// The unit is one typical container: what the running ones use on average
// (busy CPUs / running, used memory / running), held to 0.25..2 CPUs and
// 256 MiB..4 GiB; 0.5 CPU and 512 MiB when nothing runs.
//
//   by_cpu        = (cpus * 0.90 - busy CPUs) / unit_cpu
//   by_memory     = (memory available - max(5% of memory, 1 GiB)) / unit_memory_bytes
//   by_tasks      = (pid_max * 0.80 - tasks) / 64
//   by_containers = max_containers - containers running or starting
//   containers    = max(0, the smallest of the four)
//
// and 0 under pressure: memory PSI some avg10 >= 10 or full avg10 >= 2, CPU
// PSI some avg10 >= 80, IO PSI full avg10 >= 25, less memory available than
// the reserve, a disk with less than max(5%, 2 GiB) free, a start-latency
// p95 of 10 s or more, or the Mac itself under memory pressure (warning or
// critical). CPU and memory are counted on what is used, not on the limits
// containers were given: a limit is a ceiling, and the pressure terms catch
// a machine whose promised memory is being used after all.
message MachineHeadroom {
  uint32 containers = 1;
  bool under_pressure = 2;
  // Why it is under pressure; empty when it is not.
  repeated string reasons = 3;
  // The resource containers is the smallest for: cpu, memory, tasks,
  // containers, os-disk, cache-disk, pressure or host-memory.
  string limited_by = 4;
  double unit_cpu = 5;
  uint64 unit_memory_bytes = 6;
  uint32 by_cpu = 7;
  uint32 by_memory = 8;
  uint32 by_tasks = 9;
  uint32 by_containers = 10;
}

// The Mac the machine runs on, read by the API process.
message MachineHost {
  uint32 cpus = 1;
  uint64 memory_bytes = 2;
  // Free, inactive, speculative and purgeable memory.
  uint64 memory_available_bytes = 3;
  // normal, warning or critical (the kernel's memory pressure level); empty
  // when it could not be read.
  string memory_pressure = 4;
  double load1 = 5;
}
