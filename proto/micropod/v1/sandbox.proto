syntax = "proto3";

package micropod.v1;

option go_package = "github.com/castlemilk/micropod/sdk/go/gen/micropod/v1;micropodv1";

import "buf/validate/validate.proto";
import "gnostic/openapi/v3/annotations.proto";
import "micropod/v1/api.proto";
import "micropod/v1/container.proto";

// Sandboxes as a programmable environment: boot a micro-VM once, then run
// processes in it, stream their output, move files in and out, and watch
// paths — the surface the SDKs' `Sandbox` class is built on.
//
// A sandbox is a `runtime: sandbox` container owned by the API process; every
// call names it by container id. Processes and file operations run inside
// the container, seeing its mounts, /tmp and working directory, as the
// image's user. File operations, watches and the idle main process run on
// micropod's own static guest helper (shared into the sandbox read-only at
// /.micropod), so they need nothing from the image: distroless works.
service SandboxService {
  // Boot a sandbox and return once it can take processes. With no `command`
  // it idles until stopped (DeleteContainer) — the long-lived shape the SDKs
  // use.
  rpc StartSandbox(StartSandboxRequest) returns (ContainerRef);
  // Start a process in a running sandbox; returns at once with its id.
  // Follow it with StreamProcess.
  rpc StartProcess(StartProcessRequest) returns (ProcessRef);
  // The process's stdout and stderr as they arrive, then its exit. Output
  // from before the stream opened is replayed first (up to 8 MiB), so
  // start-then-stream never loses a byte; several streams may follow one
  // process. A stream that falls too far behind fails with
  // `resource_exhausted` instead of silently dropping output.
  rpc StreamProcess(ProcessRef) returns (stream ProcessEvent);
  // Write to the process's stdin (StartProcessRequest.stdin); `close` sends
  // EOF after the data.
  rpc WriteProcessStdin(WriteProcessStdinRequest) returns (Empty);
  // Signal the process (default SIGTERM).
  rpc SignalProcess(SignalProcessRequest) returns (Empty);
  // A file's bytes, up to 32 MiB.
  rpc ReadFile(PathRequest) returns (FileContent);
  // Create or replace a file (or append to it), up to 32 MiB per call.
  rpc WriteFile(WriteFileRequest) returns (Empty);
  // A directory's entries, not recursive.
  rpc ListDir(PathRequest) returns (ListDirResponse);
  // Metadata for a path, not following a final symlink; `not_found` when the
  // path does not exist.
  rpc StatPath(PathRequest) returns (FileStat);
  // Create a directory (with parents unless `recursive` is false).
  rpc MakeDir(MakeDirRequest) returns (Empty);
  // Delete a file, or a directory — non-empty ones only with `recursive`.
  rpc RemovePath(RemovePathRequest) returns (Empty);
  // Move a path; atomic within one filesystem.
  rpc RenamePath(RenamePathRequest) returns (Empty);
  // Copy a file, or a directory tree with `recursive`.
  rpc CopyPath(CopyPathRequest) returns (Empty);
  // Set a path's permission bits.
  rpc ChmodPath(ChmodPathRequest) returns (Empty);
  // Changes under a path, observed inside the guest with inotify —
  // including writes a host-side watcher never sees (the root disk, tmpfs,
  // overlay mounts). The first event is "ready": changes after it are
  // reported. (A daemon built without the guest helper falls back to the
  // image's inotifywait, else a 500 ms poll.)
  rpc WatchPath(WatchPathRequest) returns (stream WatchEvent);
  // Save the sandbox's disk as a checkpoint, then stop the sandbox. Boot a
  // new one from it with StartSandboxRequest.from_checkpoint.
  rpc CheckpointSandbox(CheckpointSandboxRequest) returns (Empty);
  // Checkpoints saved on this host (shared with `micropod sandbox checkpoint`).
  rpc ListCheckpoints(Empty) returns (ListCheckpointsResponse);
  // Delete a checkpoint.
  rpc DeleteCheckpoint(CheckpointRef) returns (Empty);
  // Replace a running sandbox's secret value — a refreshed token — without
  // the guest noticing (its placeholder never changes). `not_found` when the
  // sandbox has no such secret.
  rpc UpdateSandboxSecret(UpdateSandboxSecretRequest) returns (Empty);
}

message UpdateSandboxSecretRequest {
  // Sandbox (container) id.
  string id = 1 [(buf.validate.field).required = true, (buf.validate.field).string.min_len = 1];
  // The secret's name (the guest environment variable).
  string name = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.pattern = "^[A-Za-z_][A-Za-z0-9_]*$"
  ];
  // The new value; CR, LF and NUL are refused.
  string value = 3 [(buf.validate.field).required = true, (buf.validate.field).string.min_len = 1];
  // When it stops working (RFC 3339); empty for never.
  string expires_at = 4;
}

message StartSandboxRequest {
  option (buf.validate.message).cel = {
    id: "start_sandbox.base"
    message: "set image or from_checkpoint, not both"
    expression: "this.image == '' || this.from_checkpoint == ''"
  };
  // OCI image to boot (default "alpine:latest").
  string image = 1 [(gnostic.openapi.v3.property).example = {yaml: "'python:3.12'"}];
  // Or a checkpoint saved by CheckpointSandbox or `micropod sandbox
  // checkpoint create`.
  string from_checkpoint = 2 [
    (buf.validate.field).string.pattern = "^$|^[A-Za-z0-9][A-Za-z0-9._-]*$",
    (gnostic.openapi.v3.property).example = {yaml: "'python-env'"}
  ];
  // Optional name; becomes the sandbox (container) id.
  string name = 3 [(gnostic.openapi.v3.property).example = {yaml: "'agent-1'"}];
  // vCPUs (default 2).
  uint32 cpus = 4 [(buf.validate.field).uint32.lte = 64, (gnostic.openapi.v3.property).example = {yaml: "2"}];
  // Memory in MiB (default 2048).
  uint64 memory_mib = 5 [
    (buf.validate.field).uint64 = {gte: 0, lte: 1048576},
    (gnostic.openapi.v3.property).example = {yaml: "2048"}
  ];
  // KEY=VALUE environment for the sandbox and every process started in it.
  repeated string env = 6 [(gnostic.openapi.v3.property).example = {yaml: "['DEBUG=1']"}];
  // Default working directory.
  string workdir = 7 [(gnostic.openapi.v3.property).example = {yaml: "'/workspace'"}];
  // Host directories to share.
  repeated SandboxMount mounts = 8 [(buf.validate.field).repeated.max_items = 32];
  // TCP ports to publish; an empty host_ip binds 127.0.0.1.
  repeated PortMapping ports = 9 [(buf.validate.field).repeated.max_items = 64];
  // A NAT network with internet access (default off: no network device
  // unless ports or expose_host need a host-only one).
  bool allow_net = 10 [(gnostic.openapi.v3.property).example = {yaml: "true"}];
  // Host ports, egress allowlist, secrets, DNS, disk size.
  SandboxOptions options = 11;
  // Main process; empty idles until the sandbox is stopped.
  repeated string command = 12 [(gnostic.openapi.v3.property).example = {yaml: "[]"}];
  // Arbitrary metadata labels.
  map<string, string> labels = 13;
}

// A host directory shared into the sandbox.
message SandboxMount {
  // Absolute host path.
  string host_path = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.prefix = "/",
    (gnostic.openapi.v3.property).example = {yaml: "'/Users/me/src'"}
  ];
  // Absolute guest path.
  string guest_path = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.prefix = "/",
    (gnostic.openapi.v3.property).example = {yaml: "'/workspace'"}
  ];
  // "overlay" (default): guest writes go to a per-sandbox copy and the host
  // directory is untouched. "ro": read-only. "rw": guest writes reach the
  // host directory.
  string mode = 3 [
    (buf.validate.field).string = {in: ["", "overlay", "ro", "rw"]},
    (gnostic.openapi.v3.property).example = {yaml: "'overlay'"}
  ];
}

message StartProcessRequest {
  // Sandbox (container) id.
  string id = 1 [(buf.validate.field).required = true, (buf.validate.field).string.min_len = 1];
  // argv; use ["sh", "-c", "…"] for a shell line.
  repeated string command = 2 [
    (buf.validate.field).repeated.min_items = 1,
    (gnostic.openapi.v3.property).example = {yaml: "['npm', 'run', 'dev']"}
  ];
  // Working directory (default: the sandbox's).
  string cwd = 3 [(gnostic.openapi.v3.property).example = {yaml: "'/workspace'"}];
  // Extra KEY=VALUE environment.
  repeated string env = 4;
  // Keep stdin open for WriteProcessStdin; otherwise the process reads EOF.
  bool stdin = 5;
}

// A process in a sandbox. `pid` is set in StartProcess's response.
message ProcessRef {
  // Sandbox (container) id.
  string id = 1 [(buf.validate.field).required = true, (buf.validate.field).string.min_len = 1];
  // The id StartProcess returned.
  string process_id = 2 [(buf.validate.field).required = true, (buf.validate.field).string.min_len = 1];
  // Guest pid of the process.
  int32 pid = 3;
}

// One piece of a process's life, in order: output chunks, then its exit.
message ProcessEvent {
  oneof event {
    // Bytes the process wrote to stdout.
    bytes stdout = 1;
    // Bytes the process wrote to stderr.
    bytes stderr = 2;
    // The last event: the exit code (128 + n when killed by signal n).
    int32 exit_code = 3;
  }
}

message WriteProcessStdinRequest {
  string id = 1 [(buf.validate.field).required = true, (buf.validate.field).string.min_len = 1];
  string process_id = 2 [(buf.validate.field).required = true, (buf.validate.field).string.min_len = 1];
  // Bytes to write (up to 32 MiB).
  bytes data = 3 [(buf.validate.field).bytes.max_len = 33554432];
  // Close stdin after writing `data`.
  bool close = 4;
}

message SignalProcessRequest {
  string id = 1 [(buf.validate.field).required = true, (buf.validate.field).string.min_len = 1];
  string process_id = 2 [(buf.validate.field).required = true, (buf.validate.field).string.min_len = 1];
  // "SIGTERM" (default), "KILL", "9", …
  string signal = 3 [(gnostic.openapi.v3.property).example = {yaml: "'SIGINT'"}];
}

// A path inside a sandbox; relative paths resolve against its workdir.
message PathRequest {
  string id = 1 [(buf.validate.field).required = true, (buf.validate.field).string.min_len = 1];
  string path = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1,
    (gnostic.openapi.v3.property).example = {yaml: "'/workspace/out.json'"}
  ];
}

message FileContent {
  bytes data = 1;
}

message WriteFileRequest {
  string id = 1 [(buf.validate.field).required = true, (buf.validate.field).string.min_len = 1];
  string path = 2 [(buf.validate.field).required = true, (buf.validate.field).string.min_len = 1];
  bytes data = 3 [(buf.validate.field).bytes.max_len = 33554432];
  // Append instead of replacing.
  bool append = 4;
  // Permission bits to set, e.g. 493 (0755).
  optional uint32 mode = 5 [(buf.validate.field).uint32.lte = 4095];
  // Create missing parent directories.
  bool create_parents = 6;
}

message FileStat {
  // The path as asked for.
  string path = 1;
  // "file", "dir", "symlink" or "other".
  string type = 2;
  // Size in bytes.
  uint64 size = 3;
  // st_mode, file-type bits included.
  uint32 mode = 4;
  // Last modification, seconds since the epoch.
  int64 mtime = 5;
}

message ListDirResponse {
  repeated DirEntry entries = 1;
}

message DirEntry {
  string name = 1;
  // "file", "dir", "symlink" or "other".
  string type = 2;
  uint64 size = 3;
  uint32 mode = 4;
  int64 mtime = 5;
}

message MakeDirRequest {
  string id = 1 [(buf.validate.field).required = true, (buf.validate.field).string.min_len = 1];
  string path = 2 [(buf.validate.field).required = true, (buf.validate.field).string.min_len = 1];
  // Create missing parents too (default true).
  optional bool recursive = 3;
}

message RemovePathRequest {
  string id = 1 [(buf.validate.field).required = true, (buf.validate.field).string.min_len = 1];
  string path = 2 [(buf.validate.field).required = true, (buf.validate.field).string.min_len = 1];
  // Required to delete a non-empty directory.
  bool recursive = 3;
}

message RenamePathRequest {
  string id = 1 [(buf.validate.field).required = true, (buf.validate.field).string.min_len = 1];
  string from = 2 [(buf.validate.field).required = true, (buf.validate.field).string.min_len = 1];
  string to = 3 [(buf.validate.field).required = true, (buf.validate.field).string.min_len = 1];
}

message CopyPathRequest {
  string id = 1 [(buf.validate.field).required = true, (buf.validate.field).string.min_len = 1];
  string from = 2 [(buf.validate.field).required = true, (buf.validate.field).string.min_len = 1];
  string to = 3 [(buf.validate.field).required = true, (buf.validate.field).string.min_len = 1];
  // Required to copy a directory.
  bool recursive = 4;
}

message ChmodPathRequest {
  string id = 1 [(buf.validate.field).required = true, (buf.validate.field).string.min_len = 1];
  string path = 2 [(buf.validate.field).required = true, (buf.validate.field).string.min_len = 1];
  // Permission bits, e.g. 493 (0755).
  uint32 mode = 3 [(buf.validate.field).uint32.lte = 4095];
}

message WatchPathRequest {
  string id = 1 [(buf.validate.field).required = true, (buf.validate.field).string.min_len = 1];
  string path = 2 [(buf.validate.field).required = true, (buf.validate.field).string.min_len = 1];
  // Watch the whole tree (default true).
  optional bool recursive = 3;
}

message WatchEvent {
  // "ready" (first, once the watch is live), then "create", "modify",
  // "delete" or "rename" (both ends of a move); "overflow" when the kernel
  // dropped events (re-scan to catch up).
  string event = 1;
  // Absolute guest path of what changed.
  string path = 2;
}

message CheckpointSandboxRequest {
  string id = 1 [(buf.validate.field).required = true, (buf.validate.field).string.min_len = 1];
  // Checkpoint name; an existing one is replaced.
  string name = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.pattern = "^[A-Za-z0-9][A-Za-z0-9._-]*$",
    (gnostic.openapi.v3.property).example = {yaml: "'after-setup'"}
  ];
}

message CheckpointRef {
  string name = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.pattern = "^[A-Za-z0-9][A-Za-z0-9._-]*$"
  ];
}

message SandboxCheckpoint {
  string name = 1;
  // The image the checkpoint's disk was first built from.
  string image = 2;
  // Bytes allocated on the host (clones share blocks, so often less).
  uint64 size_bytes = 3;
  // RFC 3339.
  string created = 4;
}

message ListCheckpointsResponse {
  repeated SandboxCheckpoint checkpoints = 1;
}
