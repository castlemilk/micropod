syntax = "proto3";

package micropod.v1;

option go_package = "github.com/castlemilk/micropod/sdk/go/gen/micropod/v1;micropodv1";

import "buf/validate/validate.proto";
import "gnostic/openapi/v3/annotations.proto";
import "micropod/v1/api.proto";
import "micropod/v1/image.proto";
import "micropod/v1/volume.proto";

// Daemon-level operations: runtime snapshot, cleanup usage report, and the
// desktop app's update lifecycle (proxied over the app control socket).
service SystemService {
  // Runtime status + disk usage.
  rpc GetSystem(Empty) returns (SystemSnapshot);
  // What a cleanup would reclaim: images and volumes annotated with the
  // containers that reference them.
  rpc GetUsage(Empty) returns (UsageReport);
  // Trigger a background update check in the desktop app (Sparkle).
  // Fails with `unavailable` when the app isn't running.
  rpc CheckForUpdates(Empty) returns (UpdateStatus);
  // Last-known updater status from the desktop app.
  rpc GetUpdateStatus(Empty) returns (UpdateStatus);
  // Quit the app so a downloaded update installs and relaunches. Fails
  // with `failed_precondition` until `UpdateStatus.ready_to_install`.
  rpc ApplyUpdate(Empty) returns (UpdateStatus);
  // Millisecond liveness: runtime status and active backend without disk
  // usage. Answers `status: stopped` (never an error) when the runtime is
  // down but the API server is up.
  rpc Ping(Empty) returns (PingResponse);
  // Execution engines this server can drive, with availability,
  // capabilities and which one is the default for new containers.
  rpc ListRuntimes(Empty) returns (ListRuntimesResponse);
  // Persist the engine new containers run on when RunContainerRequest
  // leaves `runtime` unset. Fails with `failed_precondition` for an
  // unknown or unavailable engine.
  rpc SetDefaultRuntime(SetDefaultRuntimeRequest) returns (ListRuntimesResponse);
  // Enable/disable an engine or point it at a different endpoint (e.g. the
  // Docker engine at an OrbStack or colima socket). Disabled engines are
  // left out of ListContainers and refuse RunContainer. The default engine
  // cannot be disabled (`failed_precondition`). Persisted server-side.
  rpc UpdateRuntime(UpdateRuntimeRequest) returns (ListRuntimesResponse);
  // Resource usage over time for all containers ("system"), one container,
  // or one machine, as recorded by the Micropod app (every 5 s while its
  // window is open, 30 s otherwise). Rolled up and pruned by age: 10 s
  // points for 3 h, 1 min for 48 h, 15 min for 30 days — the finest that
  // covers the range is returned. A container's or machine's history is
  // deleted with it.
  rpc GetMetricsHistory(GetMetricsHistoryRequest) returns (MetricsHistory);
}

message GetMetricsHistoryRequest {
  // "system" (all containers), "container" or "machine".
  string kind = 1 [
    (buf.validate.field).string = {in: ["system", "container", "machine"]},
    (gnostic.openapi.v3.property).example = {yaml: "'container'"}
  ];
  // Container id or machine name; ignored for "system".
  string id = 2 [(gnostic.openapi.v3.property).example = {yaml: "'web'"}];
  // How far back, in seconds (0 = one hour; at most 30 days).
  uint32 range_seconds = 3 [
    (buf.validate.field).uint32.lte = 2592000,
    (gnostic.openapi.v3.property).example = {yaml: "3600"}
  ];
}

message MetricsHistory {
  // Seconds each point covers (10, 60 or 900).
  uint32 resolution_seconds = 1 [(gnostic.openapi.v3.property).example = {yaml: "10"}];
  // Oldest first; empty when nothing was recorded in the range.
  repeated MetricsPoint points = 2;
}

// One bucket: averages, plus the peak of the metrics that spike.
message MetricsPoint {
  // Start of the bucket (RFC 3339).
  string timestamp = 1 [(gnostic.openapi.v3.property).example = {yaml: "'2026-09-30T10:00:00Z'"}];
  // CPU % (100 = one core): average and peak.
  double cpu_percent = 2;
  double cpu_percent_max = 3;
  // Memory in use (bytes): average and peak.
  double memory_used_bytes = 4;
  double memory_used_bytes_max = 5;
  // Memory limit (bytes).
  double memory_limit_bytes = 6;
  // Network and disk rates (bytes per second), averages.
  double network_rx_bytes_per_second = 7;
  double network_tx_bytes_per_second = 8;
  double block_read_bytes_per_second = 9;
  double block_write_bytes_per_second = 10;
}

// One execution engine (see ListRuntimes).
message RuntimeInfo {
  // Engine name used in RunContainerRequest.runtime: "apple", "docker",
  // "sandbox".
  string name = 1 [(gnostic.openapi.v3.property).example = {yaml: "'apple'"}];
  // What kind of isolation it provides: "vm" (micro-VM per container via
  // a runtime daemon), "microvm" (in-process ephemeral micro-VM) or
  // "container" (shared-kernel containers inside one VM).
  string kind = 2 [(gnostic.openapi.v3.property).example = {yaml: "'vm'"}];
  // Human-readable one-liner.
  string description = 3;
  // True when the engine can take work right now.
  bool available = 4 [(gnostic.openapi.v3.property).example = {yaml: "true"}];
  // Why it is unavailable (empty when available).
  string reason = 5 [(gnostic.openapi.v3.property).example = {yaml: "'Docker socket not found'"}];
  // Engine version when known.
  string version = 6 [(gnostic.openapi.v3.property).example = {yaml: "'1.3.1'"}];
  // Where the engine lives: a socket path, install root or state dir.
  string endpoint = 7 [(gnostic.openapi.v3.property).example = {yaml: "'unix:///var/run/docker.sock'"}];
  // Default engine for RunContainer when `runtime` is unset.
  bool default = 8;
  // Container operations the engine supports: "run", "create", "start",
  // "stop", "kill", "delete", "exec", "logs", "stats", "ports", "volumes".
  // Calls outside this set fail with `unimplemented`.
  repeated string capabilities = 9 [(gnostic.openapi.v3.property).example = {yaml: "['run', 'exec', 'logs']"}];
  // Enabled engines contribute to ListContainers and accept RunContainer.
  // "docker" starts disabled so an existing Docker Desktop's containers
  // don't appear until asked for.
  bool enabled = 10 [(gnostic.openapi.v3.property).example = {yaml: "true"}];
}

message ListRuntimesResponse {
  repeated RuntimeInfo runtimes = 1;
  // Name of the default engine.
  string default = 2 [(gnostic.openapi.v3.property).example = {yaml: "'apple'"}];
}

message UpdateRuntimeRequest {
  // Engine name from ListRuntimes.
  string name = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.pattern = "^[a-z][a-z0-9-]*$",
    (gnostic.openapi.v3.property).example = {yaml: "'docker'"}
  ];
  // Enable or disable the engine; unset leaves it unchanged.
  optional bool enabled = 2 [(gnostic.openapi.v3.property).example = {yaml: "true"}];
  // Engine endpoint override; empty string restores the default. Docker:
  // "unix:///path/docker.sock" or "tcp://host:port" (plain HTTP). Other
  // engines reject an endpoint with `invalid_argument`.
  optional string endpoint = 3 [(gnostic.openapi.v3.property).example = {yaml: "'unix:///Users/me/.orbstack/run/docker.sock'"}];
}

message SetDefaultRuntimeRequest {
  // Engine name from ListRuntimes.
  string name = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.pattern = "^[a-z][a-z0-9-]*$",
    (gnostic.openapi.v3.property).example = {yaml: "'sandbox'"}
  ];
}

// Cheap liveness reply for detection and health ticks (see Ping).
message PingResponse {
  // "running" or "stopped".
  string status = 1 [(gnostic.openapi.v3.property).example = {yaml: "'running'"}];
  // Backend the API server is currently driving: "native" (XPC) or "cli".
  string runtime_backend = 2 [(gnostic.openapi.v3.property).example = {yaml: "'native'"}];
  // Version of the embedded API server.
  string api_server_version = 3 [(gnostic.openapi.v3.property).example = {yaml: "'0.8.0'"}];
  // Version of the bundled `container` CLI.
  string cli_version = 4 [(gnostic.openapi.v3.property).example = {yaml: "'0.7.0'"}];
  // Optional request capabilities this server honours, so clients can
  // detect them instead of sending fields an older server would silently
  // ignore (proto3 drops unknown fields). Names are the
  // `RunContainerRequest` field names: "cap_add", "cap_drop", "rosetta",
  // "privileged". Empty on servers that predate the list.
  repeated string features = 5 [(gnostic.openapi.v3.property).example = {yaml: "['cap_add', 'cap_drop', 'rosetta', 'privileged']"}];
  // Engine RunContainer uses when `runtime` is unset (see ListRuntimes).
  // Empty on servers that predate engine selection.
  string default_runtime = 6 [(gnostic.openapi.v3.property).example = {yaml: "'apple'"}];
}

message SystemSnapshot {
  // Runtime health (status, versions, install paths).
  SystemStatus status = 1;
  // Disk usage grouped by resource kind.
  DiskUsage disk_usage = 2;
}

// Runtime health, mapped from `container system status`.
message SystemStatus {
  // "running" or "stopped".
  string status = 1 [(gnostic.openapi.v3.property).example = {yaml: "'running'"}];
  // Path to the installed Micropod.app bundle.
  string app_root = 2 [(gnostic.openapi.v3.property).example = {yaml: "'/Applications/Micropod.app'"}];
  // Runtime install root (binaries, kernels, images).
  string install_root = 3 [(gnostic.openapi.v3.property).example = {yaml: "'~/.micropod'"}];
  // Version of the embedded API server.
  string api_server_version = 4 [(gnostic.openapi.v3.property).example = {yaml: "'0.8.0'"}];
  // Version of the bundled `container` CLI.
  string cli_version = 5 [(gnostic.openapi.v3.property).example = {yaml: "'0.7.0'"}];
  // Backend the API server is currently driving: "native" (XPC) or "cli".
  string runtime_backend = 6 [(gnostic.openapi.v3.property).example = {yaml: "'native'"}];
}

// Disk usage, mapped from `container system df`.
message DiskUsage {
  // Disk usage attributed to containers.
  DiskCategory containers = 1;
  // Disk usage attributed to images.
  DiskCategory images = 2;
  // Disk usage attributed to volumes.
  DiskCategory volumes = 3;
  // Bytes reclaimable by pruning across all categories.
  uint64 total_reclaimable_bytes = 4;
}

message DiskCategory {
  // Total objects in the category.
  uint64 total = 1 [(gnostic.openapi.v3.property).example = {yaml: "12"}];
  // Objects currently referenced by a running workload.
  uint64 active = 2 [(gnostic.openapi.v3.property).example = {yaml: "5"}];
  // On-disk size of the category in bytes.
  uint64 size_bytes = 3 [(gnostic.openapi.v3.property).example = {yaml: "4294967296"}];
  // Bytes freed if inactive objects were pruned.
  uint64 reclaimable_bytes = 4 [(gnostic.openapi.v3.property).example = {yaml: "1073741824"}];
}

// Single snapshot of runtime resource usage for all running containers,
// mapped from `container stats --no-stream --format json`.
message StatsSnapshot {
  // Per-container stats, one entry per running container.
  repeated ContainerStats containers = 1;
  // ISO8601 timestamp the snapshot was taken.
  string sampled_at = 2 [(gnostic.openapi.v3.property).example = {yaml: "'2026-01-15T10:30:00Z'"}, (gnostic.openapi.v3.property).format = "date-time"];
}

// Per-container resource counters within a StatsSnapshot.
message ContainerStats {
  // Container ID.
  string id = 1 [(gnostic.openapi.v3.property).example = {yaml: "'web'"}];
  // CPU usage as a percentage of one core.
  double cpu_percent = 2 [(gnostic.openapi.v3.property).example = {yaml: "12.5"}];
  // Resident memory in bytes.
  uint64 memory_used_bytes = 3 [(gnostic.openapi.v3.property).example = {yaml: "134217728"}];
  // Configured memory limit in bytes.
  uint64 memory_limit_bytes = 4 [(gnostic.openapi.v3.property).example = {yaml: "536870912"}];
  // Bytes received over the container network.
  uint64 network_rx_bytes = 5 [(gnostic.openapi.v3.property).example = {yaml: "1048576"}];
  // Bytes transmitted over the container network.
  uint64 network_tx_bytes = 6 [(gnostic.openapi.v3.property).example = {yaml: "524288"}];
  // Bytes read from the block device.
  uint64 block_read_bytes = 7 [(gnostic.openapi.v3.property).example = {yaml: "2097152"}];
  // Bytes written to the block device.
  uint64 block_write_bytes = 8 [(gnostic.openapi.v3.property).example = {yaml: "1048576"}];
  // Number of processes inside the container.
  uint64 pids = 9 [(gnostic.openapi.v3.property).example = {yaml: "7"}];
  // Cumulative CPU time consumed by the container since it started, in
  // microseconds (cgroup `cpu.stat` usage_usec), summed across cores.
  // Exact on every sample, including the first one for an id (unlike
  // `cpu_percent`, which is a delta and reads 0 until a baseline exists),
  // so callers can compute their own rates. 0 = not reported by the
  // backend (the Docker engine reports its own `cpu_usage.total_usage`
  // converted from nanoseconds).
  uint64 cpu_usage_usec = 10 [(gnostic.openapi.v3.property).example = {yaml: "6576389781"}];
  // Processes in the container killed by the kernel OOM killer since it
  // started (cgroup `memory.events` oom_kill), read from the guest agent.
  // Unset = not reported (CLI and Docker backends, a guest agent that did
  // not answer in time, or one without memory-event support); a set 0
  // means "read, no OOM kills". Native backend only.
  optional uint64 oom_kill_count = 11 [(gnostic.openapi.v3.property).example = {yaml: "0"}];
  // Whether the backend observed both block byte counters in this sample.
  // true includes measured zero; false means unavailable. Absent is an older
  // producer: a positive counter is reported, but zero has unknown presence.
  // These counters cover every container device, not individual cache volumes.
  optional bool block_io_observed = 12;
}

// A registry login, mapped from `container registry list`.
message RegistryLogin {
  // Registry hostname, e.g. "docker.io".
  string server = 1 [(gnostic.openapi.v3.property).example = {yaml: "'docker.io'"}];
  // Account username stored for the registry.
  string username = 2 [(gnostic.openapi.v3.property).example = {yaml: "'octocat'"}];
  // Auth scheme in use, e.g. "basic" or "oauth".
  string scheme = 3 [(gnostic.openapi.v3.property).example = {yaml: "'basic'"}];
}

// What a cleanup would reclaim: every image and volume annotated with the
// containers that reference it.
message UsageReport {
  // An image plus the containers that reference it.
  message ImageUsage {
    // The image.
    Image image = 1;
    // IDs of containers referencing this image.
    repeated string used_by_container_ids = 2;
    // True when at least one container references the image.
    bool in_use = 3;
  }
  // A volume plus the containers mounting it.
  message VolumeUsage {
    // The volume.
    Volume volume = 1;
    // IDs of containers mounting this volume.
    repeated string used_by_container_ids = 2;
    // True when at least one container mounts the volume.
    bool in_use = 3;
  }
  // Every local image with its referencing containers.
  repeated ImageUsage images = 1;
  // Every local volume with its mounting containers.
  repeated VolumeUsage volumes = 2;
  // Bytes reclaimable by pruning unreferenced images.
  uint64 reclaimable_image_bytes = 3 [(gnostic.openapi.v3.property).example = {yaml: "2147483648"}];
  // Bytes reclaimable by pruning unmounted volumes.
  uint64 reclaimable_volume_bytes = 4 [(gnostic.openapi.v3.property).example = {yaml: "1073741824"}];
  // Number of stopped containers.
  int32 stopped_container_count = 5 [(gnostic.openapi.v3.property).example = {yaml: "2"}];
}

// Desktop-app updater status (Sparkle), proxied over the app control
// socket. Reported by CheckForUpdates, GetUpdateStatus, and ApplyUpdate.
message UpdateStatus {
  // Updater lifecycle state.
  enum State {
    // Never emitted — zero value only.
    STATE_UNSPECIFIED = 0;
    // No update feed configured (dev/test builds).
    STATE_UNAVAILABLE = 1;
    // Feed configured, nothing in flight.
    STATE_IDLE = 2;
    // A check is running.
    STATE_CHECKING = 3;
    // Last check found nothing newer.
    STATE_UP_TO_DATE = 4;
    // A newer version is available on the feed.
    STATE_UPDATE_AVAILABLE = 5;
    // An update is being installed.
    STATE_INSTALLING = 6;
    // Last check/apply failed — see `error`.
    STATE_ERROR = 7;
    // Downloaded and staged: ApplyUpdate (or quitting) installs it.
    STATE_READY_TO_INSTALL = 8;
  }
  // Updater lifecycle state.
  State state = 1 [(gnostic.openapi.v3.property).example = {yaml: "'STATE_UPDATE_AVAILABLE'"}];
  // Whether a Sparkle feed URL is configured.
  bool feed_configured = 2;
  // Currently running app version.
  string current_version = 3 [(gnostic.openapi.v3.property).example = {yaml: "'0.8.0'"}];
  // Version available on the feed, if an update was found.
  string available_version = 4 [(gnostic.openapi.v3.property).example = {yaml: "'0.9.0'"}];
  // True once an update has finished downloading.
  bool downloaded = 5;
  // Version staged for install.
  string downloaded_version = 6 [(gnostic.openapi.v3.property).example = {yaml: "'0.9.0'"}];
  // True when ApplyUpdate will succeed immediately.
  bool ready_to_install = 7;
  // Last updater error, when `state` is STATE_ERROR.
  string error = 8;
  // ISO8601 time of the last completed check.
  string checked_at = 9 [(gnostic.openapi.v3.property).example = {yaml: "'2026-01-15T10:30:00Z'"}, (gnostic.openapi.v3.property).format = "date-time"];
}
