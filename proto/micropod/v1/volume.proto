syntax = "proto3";

package micropod.v1;

option go_package = "github.com/castlemilk/micropod/sdk/go/gen/micropod/v1;micropodv1";

import "buf/validate/validate.proto";
import "gnostic/openapi/v3/annotations.proto";
import "micropod/v1/api.proto";

// Named volumes plus the mount policy applied on container create.
service VolumeService {
  // List all volumes.
  rpc ListVolumes(Empty) returns (ListVolumesResponse);
  // Create a named volume.
  rpc CreateVolume(CreateVolumeRequest) returns (Empty);
  // Remove a named volume.
  rpc DeleteVolume(DeleteVolumeRequest) returns (Empty);
  // Named-volume mount policy applied on container create across every
  // surface (API, shim, app, CLI, MCP).
  rpc GetVolumePolicy(Empty) returns (VolumePolicy);
  // Replace the volume mount policy; returns the stored policy.
  rpc SetVolumePolicy(VolumePolicy) returns (VolumePolicy);
  // Create a new volume whose backing image is a clonefile copy of the
  // source volume's image (O(1) on APFS). Fails with `not_found` when the
  // source does not exist and `failed_precondition` when the source is
  // attached read-write to a running container.
  rpc CloneVolume(CloneVolumeRequest) returns (Volume);
  // Promote a container's per-container clone of `volume` to be the
  // volume's backing image (fsync + atomic rename, serialised per volume).
  // Fails with `not_found` when the clone or the volume's source is absent
  // and `failed_precondition` unless the container is `stopped` and the
  // volume is not attached to a running container. `unimplemented` on
  // backends that never create clones.
  rpc CommitVolumeClone(CommitVolumeCloneRequest) returns (CommitVolumeCloneResponse);
}

// Curated volume, mapped from `container volume list`.
message Volume {
  // Volume name (used as the ID).
  string id = 1 [(gnostic.openapi.v3.property).example = {yaml: "'data'"}];
  // Volume driver, e.g. "local".
  string driver = 2 [(gnostic.openapi.v3.property).example = {yaml: "'local'"}];
  // Filesystem format, e.g. "ext4".
  string format = 3 [(gnostic.openapi.v3.property).example = {yaml: "'ext4'"}];
  // Volume size in bytes.
  uint64 size_bytes = 4 [(gnostic.openapi.v3.property).example = {yaml: "10737418240"}];
  // Backing source (name or host path).
  string source = 5 [(gnostic.openapi.v3.property).example = {yaml: "'data'"}];
  // ISO8601 creation timestamp.
  string created_at = 6 [(gnostic.openapi.v3.property).example = {yaml: "'2026-01-15T10:30:00Z'"}, (gnostic.openapi.v3.property).format = "date-time"];
  // Metadata labels on the volume.
  map<string, string> labels = 7;
  // Bytes actually allocated on disk by the backing image (st_blocks × 512).
  // `size_bytes` is the provisioned size; sparse images allocate far less.
  uint64 allocated_bytes = 8 [(gnostic.openapi.v3.property).example = {yaml: "268435456"}];
}

// Named-volume mount policy — read on container create by every surface
// (API, docker shim, app, CLI, MCP). Per-container `com.micropod.*` labels
// take precedence over this policy.
message VolumePolicy {
  // Which named-volume mounts get clonefile-forked per container.
  enum CloneMode {
    // Treated as CLONE_MODE_LABELS (the standard default).
    CLONE_MODE_UNSPECIFIED = 0;
    // Only mounts carrying the `com.micropod.cache.clone` label.
    CLONE_MODE_LABELS = 1;
    // Auto-clone mounts of the volumes named in `golden_volumes`.
    CLONE_MODE_GOLDENS = 2;
    // Clone every named-volume mount.
    CLONE_MODE_ALL = 3;
  }
  // Writeback sync mode for volume disk images.
  enum SyncMode {
    // Per-mount default (fsync for named volumes, nosync for clones).
    SYNC_MODE_UNSPECIFIED = 0;
    // Flush writes on every write.
    SYNC_MODE_FULL = 1;
    // fsync on container stop.
    SYNC_MODE_FSYNC = 2;
    // Never fsync — fastest, can lose writes on host crash.
    SYNC_MODE_NOSYNC = 3;
  }
  // VZ disk-image caching mode.
  enum CacheMode {
    // Treated as CACHE_MODE_ON (the standard default).
    CACHE_MODE_UNSPECIFIED = 0;
    // Always cache the disk image.
    CACHE_MODE_ON = 1;
    // Never cache.
    CACHE_MODE_OFF = 2;
    // Cache when the volume driver supports it.
    CACHE_MODE_AUTO = 3;
  }
  // Which named-volume mounts get clonefile-forked per container.
  CloneMode clone_mode = 1 [(gnostic.openapi.v3.property).example = {yaml: "'CLONE_MODE_LABELS'"}];
  // Volume names auto-cloned under `CLONE_MODE_GOLDENS`.
  repeated string golden_volumes = 2 [(gnostic.openapi.v3.property).example = {yaml: "['xcode-derived']"}];
  // Restrict cloning to job-labelled containers (`com.cuttlefish.job` /
  // `com.micropod.job`). Per-container clone labels always apply.
  bool jobs_only = 3;
  // Writeback sync mode override; `SYNC_MODE_UNSPECIFIED` keeps the
  // per-mount default.
  SyncMode sync = 4 [(gnostic.openapi.v3.property).example = {yaml: "'SYNC_MODE_FSYNC'"}];
  // VZ disk-image cache mode.
  CacheMode cache = 5 [(gnostic.openapi.v3.property).example = {yaml: "'CACHE_MODE_ON'"}];
}

message ListVolumesResponse {
  // Every volume, in `container volume list` order.
  repeated Volume volumes = 1;
}

message CreateVolumeRequest {
  // Volume name.
  string name = 1 [(buf.validate.field).required = true, (buf.validate.field).string.min_len = 1, (gnostic.openapi.v3.property).example = {yaml: "'data'"}];
  // Optional size limit, e.g. "10g".
  optional string size = 2 [(gnostic.openapi.v3.property).example = {yaml: "'10g'"}];
  // Labels applied to the volume ("key=value").
  repeated string labels = 3 [(gnostic.openapi.v3.property).example = {yaml: "['com.example.project=web']"}];
  // Driver options passed through to the volume driver.
  repeated string options = 4;
}

message DeleteVolumeRequest {
  // Volume name to remove.
  string name = 1 [(buf.validate.field).required = true, (buf.validate.field).string.min_len = 1, (gnostic.openapi.v3.property).example = {yaml: "'data'"}];
}

message CloneVolumeRequest {
  // Existing volume to clone from.
  string source = 1 [(buf.validate.field).required = true, (buf.validate.field).string.min_len = 1, (gnostic.openapi.v3.property).example = {yaml: "'golden-cache'"}];
  // Name of the new volume.
  string name = 2 [(buf.validate.field).required = true, (buf.validate.field).string.min_len = 1, (gnostic.openapi.v3.property).example = {yaml: "'job-42-cache'"}];
  // Optional size for the new volume, e.g. "10g". Defaults to the source's
  // provisioned size.
  optional string size = 3 [(gnostic.openapi.v3.property).example = {yaml: "'10g'"}];
  // Labels applied to the new volume ("key=value").
  repeated string labels = 4 [(gnostic.openapi.v3.property).example = {yaml: "['com.example.job=42']"}];
}

message CommitVolumeCloneRequest {
  // Stopped container whose clone of `volume` is promoted.
  string container_id = 1 [(buf.validate.field).required = true, (buf.validate.field).string.min_len = 1, (gnostic.openapi.v3.property).example = {yaml: "'job-42'"}];
  // Volume whose backing image is replaced by the container's clone.
  string volume = 2 [(buf.validate.field).required = true, (buf.validate.field).string.min_len = 1, (gnostic.openapi.v3.property).example = {yaml: "'golden-cache'"}];
}

message CommitVolumeCloneResponse {
  // Bytes allocated on disk by the promoted image (st_blocks × 512).
  uint64 allocated_bytes = 1 [(gnostic.openapi.v3.property).example = {yaml: "268435456"}];
}
