<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{TITLE}} — Micropod</title>
  <meta name="description" content="{{DESCRIPTION}}" />
  <link rel="canonical" href="https://castlemilk.github.io{{CANONICAL}}" />
  <link rel="icon" type="image/png" href="/micropod/icon.png" />
  <meta property="og:type" content="article" />
  <meta property="og:title" content="{{TITLE}} — Micropod" />
  <meta property="og:description" content="{{DESCRIPTION}}" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --font-sans: 'Instrument Sans', system-ui, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
      --bg: #070d16;
      --bg-card: #0d1626;
      --bg-secondary: #111c30;
      --fg: #e8eefc;
      --fg-muted: #8b9bb8;
      --border: #1b2a45;
      --primary: #0a84ff;
      --primary-fg: #050b14;
      --success: #32d74b;
      --warn: #ffd60a;
      --destructive: #ff453a;
      --radius: 0.75rem;
    }
    body {
      font-family: var(--font-sans); background: var(--bg); color: var(--fg);
      line-height: 1.5; -webkit-font-smoothing: antialiased;
    }
    a { color: var(--primary); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .nav {
      position: sticky; top: 0; z-index: 50;
      border-bottom: 1px solid var(--border);
      background: color-mix(in srgb, var(--bg) 80%, transparent);
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    }
    .nav-inner { display: flex; align-items: center; justify-content: space-between; max-width: 80rem; margin: 0 auto; padding: 0.875rem 1.5rem; }
    .nav-logo { display: flex; align-items: center; gap: 0.625rem; font-weight: 600; color: var(--fg); }
    .nav-logo:hover { text-decoration: none; }
    .nav-logo-mark {
      display: flex; align-items: center; justify-content: center;
      width: 1.75rem; height: 1.75rem; border-radius: 0.5rem;
      background: var(--primary); color: var(--primary-fg);
      font-weight: 700; font-size: 0.875rem;
    }
    .nav-links { display: flex; align-items: center; gap: 1.5rem; font-size: 0.875rem; color: var(--fg-muted); }
    .nav-links a { color: var(--fg-muted); }
    .nav-links a:hover { color: var(--fg); text-decoration: none; }

    /* Article */
    .article { max-width: 46rem; margin: 0 auto; padding: 4rem 1.5rem 6rem; }
    .article-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 0.75rem; font-size: 0.75rem; color: var(--fg-muted); margin-bottom: 1.5rem; }
    .article h1 { font-size: 2rem; font-weight: 700; letter-spacing: -0.02em; line-height: 1.15; }
    .standfirst { margin-top: 1rem; font-size: 1.0625rem; line-height: 1.6; color: var(--fg-muted); }
    .tag {
      font-family: var(--font-mono); font-size: 0.6875rem; color: var(--primary);
      border: 1px solid color-mix(in srgb, var(--primary) 25%, transparent);
      border-radius: 9999px; padding: 0.0625rem 0.5rem;
    }
    .article-body { margin-top: 3rem; }
    .article-body h2 { font-size: 1.375rem; font-weight: 700; letter-spacing: -0.02em; margin-top: 2.75rem; margin-bottom: 0.875rem; }
    .article-body h3 { font-size: 1.0625rem; font-weight: 600; margin-top: 2rem; margin-bottom: 0.625rem; }
    .article-body p { font-size: 0.9375rem; line-height: 1.75; color: var(--fg); margin-top: 1rem; }
    .article-body p:first-child { margin-top: 0; }
    .article-body strong { font-weight: 600; }
    .article-body ul, .article-body ol { margin-top: 1rem; padding-left: 1.5rem; }
    .article-body li { font-size: 0.9375rem; line-height: 1.75; margin-top: 0.375rem; }
    .article-body code {
      font-family: var(--font-mono); font-size: 0.8125rem; color: var(--primary);
      background: color-mix(in srgb, var(--primary) 7%, transparent);
      padding: 0.125rem 0.375rem; border-radius: 0.25rem;
    }
    .article-body pre {
      margin-top: 1.25rem; border-radius: 0.5rem; border: 1px solid var(--border);
      background: var(--bg-secondary); overflow-x: auto;
    }
    .article-body pre code {
      display: block; padding: 0.875rem 1rem; font-size: 0.75rem; line-height: 1.65;
      color: var(--fg); background: none; padding: 0.875rem 1rem;
    }
    .article-body table {
      width: 100%; margin-top: 1.25rem; border-collapse: collapse;
      font-size: 0.8125rem; border: 1px solid var(--border); border-radius: var(--radius);
      overflow: hidden; display: block; overflow-x: auto;
    }
    .article-body thead { background: var(--bg-card); }
    .article-body th, .article-body td { padding: 0.625rem 0.875rem; text-align: left; border-bottom: 1px solid var(--border); white-space: nowrap; }
    .article-body th { font-weight: 600; }
    .article-body tbody tr:last-child td { border-bottom: none; }
    .article-body blockquote {
      margin-top: 1.25rem; padding-left: 1rem; border-left: 2px solid var(--primary);
      color: var(--fg-muted);
    }
    .article-body hr { margin: 2.5rem 0; border: none; border-top: 1px solid var(--border); }
    .callout {
      margin-top: 1.25rem; padding: 1rem 1.25rem; border-radius: 0.5rem;
      border: 1px solid color-mix(in srgb, var(--warn) 30%, transparent);
      background: color-mix(in srgb, var(--warn) 5%, transparent);
      font-size: 0.875rem; line-height: 1.7;
    }
    .callout-title { font-weight: 600; margin-bottom: 0.25rem !important; }
    .callout p { font-size: 0.875rem !important; }

    /* Blog index */
    .post-list { margin-top: 3rem; display: grid; gap: 1rem; }
    .post-card {
      display: block; border-radius: var(--radius); border: 1px solid var(--border);
      background: var(--bg-card); padding: 1.5rem; color: var(--fg);
      transition: border-color 0.2s;
    }
    .post-card:hover { border-color: color-mix(in srgb, var(--primary) 25%, transparent); text-decoration: none; }
    .post-card h2 { font-size: 1.125rem; font-weight: 700; letter-spacing: -0.02em; }
    .post-card > p { margin-top: 0.5rem; font-size: 0.8125rem; color: var(--fg-muted); line-height: 1.6; }
    .post-date { font-family: var(--font-mono); font-size: 0.6875rem; color: var(--fg-muted); margin-bottom: 0.5rem; }
    .post-tags { margin-top: 0.875rem; display: flex; gap: 0.5rem; }

    .footer { border-top: 1px solid var(--border); padding: 2rem 0; font-size: 0.75rem; color: var(--fg-muted); }
    .footer-inner { max-width: 80rem; margin: 0 auto; padding: 0 1.5rem; display: flex; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
  </style>
</head>
<body>
  <header class="nav">
    <div class="nav-inner">
      <a href="/micropod/" class="nav-logo">
        <span class="nav-logo-mark">M</span>
        <span>Micropod</span>
      </a>
      <div class="nav-links">
        <a href="/micropod/#features">Features</a>
        <a href="/micropod/#agents">Agents</a>
        <a href="/micropod/api/">API Docs</a>
        <a href="/micropod/blog/">Blog</a>
        <a href="https://github.com/castlemilk/micropod" target="_blank" rel="noopener">GitHub</a>
      </div>
    </div>
  </header>

  <main>
    <article class="article">
      <div class="article-meta">
        <span>{{DATE}}</span>
        <span>{{READING}}</span>
        {{TAGS}}
      </div>
      <h1>{{TITLE}}</h1>
      <p class="standfirst">{{STANDFIRST}}</p>
      <div class="article-body">
{{BODY}}
      </div>
    </article>
  </main>

  <footer class="footer">
    <div class="footer-inner">
      <span>© 2026 Micropod — a skunkworq project</span>
      <span>Built on <a href="https://github.com/apple/container" target="_blank" rel="noopener" style="color:var(--primary)">apple/container</a></span>
    </div>
  </footer>
</body>
</html>
