[workspace]
resolver = "2"
members = [
    "crates/hvf-sys",
    "crates/vmm-fdt",
    "crates/vmm-virtio",
    "crates/vmm-net",
    "crates/vmm-core",
    "bin/micropod-vmm",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
